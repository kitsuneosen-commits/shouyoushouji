<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加帕里公园：朋友收集（联机版）</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(180deg, #0f172a 0%, #042f2e 50%, #022c22 100%);
  color: #fff; min-height: 100vh; overflow-x: hidden;
  user-select: none;
}
/* ===== 大厅 ===== */
#menu { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.menu-box { text-align: center; max-width: 460px; width: 90%; }
.menu-logo { font-size: 64px; margin-bottom: 8px; }
.menu-title { font-size: 38px; font-weight: 900; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
.menu-sub { color: #fbbf24; font-weight: 800; font-size: 20px; margin: 4px 0 24px; }
.menu-card { background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 24px; backdrop-filter: blur(8px); }
.menu-card label { display: block; color: rgba(255,255,255,.7); font-size: 13px; margin-bottom: 8px; text-align: left; }
.menu-card input { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; font-size: 16px; outline: none; }
.menu-card input:focus { border-color: #fbbf24; }
.ai-row { display: flex; gap: 8px; margin: 14px 0; }
.ai-btn { flex: 1; padding: 10px 0; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: .15s; }
.ai-btn.on { background: linear-gradient(90deg,#f59e0b,#f97316); border-color: #fbbf24; box-shadow: 0 0 16px rgba(251,191,36,.4); }
.start-btn { width: 100%; padding: 14px 0; border: none; border-radius: 12px; background: linear-gradient(90deg,#f59e0b,#ea580c); color: #fff; font-size: 19px; font-weight: 900; cursor: pointer; transition: .15s; box-shadow: 0 6px 20px rgba(234,88,12,.4); }
.start-btn:hover { transform: scale(1.02); }
.start-btn:active { transform: scale(.97); }
.menu-tip { color: rgba(255,255,255,.4); font-size: 12px; margin-top: 16px; line-height: 1.7; }

/* ===== 桌面 ===== */
#game { display: none; }
.topbar { position: sticky; top: 0; z-index: 40; background: rgba(0,0,0,.55); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,255,255,.1); padding: 8px 16px; display: flex; align-items: center; gap: 16px; font-size: 13px; }
.topbar b { color: #fbbf24; }
.topbar .sp { flex: 1; }
.topbar button { background: none; border: none; color: rgba(255,255,255,.6); cursor: pointer; font-size: 12px; text-decoration: underline; }
.table-area { max-width: 1100px; margin: 0 auto; padding: 14px 14px 410px; }

/* 对手卡 */
.opponents { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.opp { position: relative; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.25); padding: 10px; transition: .3s; }
.opp.cur { border-color: rgba(251,191,36,.8); animation: turnpulse 1.8s infinite; }
.opp.dead { filter: grayscale(1) brightness(.5); }
.opp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.opp-head .nm { font-weight: 800; font-size: 14px; }
.opp-head .fv { margin-left: auto; color: #fde047; font-weight: 900; font-size: 15px; }
.tag-ai { font-size: 10px; padding: 1px 6px; border-radius: 99px; background: #6366f1; font-weight: 800; }
.tag-declare { font-size: 10px; padding: 1px 6px; border-radius: 99px; background: #facc15; color: #1e293b; font-weight: 900; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .4; } }
.slots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.slot { aspect-ratio: 3/4.2; border-radius: 6px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); overflow: hidden; cursor: pointer; position: relative; }
.slot img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.slot.locked { border-color: rgba(239,68,68,.6); background: rgba(127,29,29,.3); }
.slot.locked::after { content: '🔒'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.slot.sel { border-color: #fbbf24; background: rgba(251,191,36,.2); animation: blink 1s infinite; }
.opp.sel-tgt { border-color: #fbbf24; box-shadow: 0 0 18px rgba(251,191,36,.55); animation: turnpulse 1.4s infinite; }
.opp-foot { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: rgba(255,255,255,.55); }

/* 中央区 */
.center { display: flex; align-items: center; justify-content: center; gap: 28px; margin: 18px 0; }
.pile { text-align: center; }
.pile-box { width: 92px; height: 132px; position: relative; }
.pile-box .cb { position: absolute; inset: 0; border-radius: 10px; border: 2px solid rgba(251,191,36,.4); background: linear-gradient(135deg,#0f766e,#134e4a); }
.pile-box .cb::after { content: '🐾'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; opacity: .85; }
.pile-n { font-size: 11px; color: rgba(255,255,255,.6); margin-top: 6px; }
.resolve-zone { flex: 1; max-width: 430px; min-height: 185px; border-radius: 14px; border: 1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.3); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; position: relative; animation: tablepulse 5s infinite; }
.rz-title { position: absolute; top: 8px; left: 12px; font-size: 11px; color: #fbbf24; font-weight: 800; }
.rz-timer { position: absolute; top: 8px; right: 12px; font-size: 11px; color: rgba(255,255,255,.65); }
.rz-card { width: 108px; height: 152px; animation: floatcard 3s infinite; }
.rz-card img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 10px; border: 3px solid rgba(255,255,255,.5); box-shadow: 0 8px 30px rgba(0,0,0,.6); }
.rz-info { font-size: 12px; color: rgba(255,255,255,.75); margin-top: 8px; text-align: center; line-height: 1.6; }
.rz-chain { color: #7dd3fc; font-size: 11px; }
@keyframes floatcard { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes tablepulse { 0%,100% { box-shadow: inset 0 0 60px 10px rgba(13,148,136,.12); } 50% { box-shadow: inset 0 0 90px 26px rgba(20,184,166,.25); } }
@keyframes turnpulse { 0%,100% { box-shadow: 0 0 0 2px rgba(251,191,36,.35), 0 0 14px rgba(251,191,36,.2); } 50% { box-shadow: 0 0 0 3px rgba(251,191,36,.85), 0 0 26px rgba(251,191,36,.5); } }

/* 我的状态 */
.me-panel { border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: rgba(0,0,0,.25); padding: 10px 12px; margin-bottom: 10px; }
.me-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.me-head .nm { font-weight: 800; }
.me-head .fv { margin-left: auto; color: #fde047; font-weight: 900; font-size: 18px; }
.my-turn { font-size: 10px; padding: 2px 8px; border-radius: 99px; background: #34d399; color: #064e3b; font-weight: 900; }
.declare-btn { margin-left: 10px; padding: 4px 12px; border: none; border-radius: 8px; background: linear-gradient(90deg,#facc15,#f59e0b); color: #1e293b; font-weight: 900; font-size: 12px; cursor: pointer; animation: blink 1.4s infinite; }

/* 手牌 */
.hand-zone { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: linear-gradient(0deg, rgba(0,0,0,.9) 20%, transparent); padding: 44px 12px 10px; }
.hand-row { display: flex; justify-content: center; align-items: flex-end; gap: 4px; height: 176px; perspective: 900px; }
.hcard { width: 108px; height: 152px; position: relative; transform-origin: bottom center; transition: transform .18s cubic-bezier(.2,.8,.3,1); }
.hcard:hover { transform: translateY(-64px) scale(1.3) !important; z-index: 50; }
.hcard-inner { width: 100%; height: 100%; border-radius: 9px; overflow: hidden; position: relative; border: 2px solid rgba(255,255,255,.35); box-shadow: 0 6px 18px rgba(0,0,0,.5); cursor: pointer; }
.hcard-inner img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.hcard-inner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.3) 50%, transparent 58%); transform: translateX(-160%); animation: shine 3s infinite; }
@keyframes shine { 0%,60% { transform: translateX(-160%); } 100% { transform: translateX(160%); } }
.hcard.sel .hcard-inner { border-color: #fde047; box-shadow: 0 0 0 3px rgba(251,191,36,.7), 0 10px 30px rgba(251,191,36,.4); }
.hcard.bondcand .hcard-inner { border-color: #e879f9; }
.hcard.cntcand .hcard-inner { border-color: #ff4d4d; animation: redpulse 1.1s ease-in-out infinite; }
@keyframes redpulse {
  0%,100% { box-shadow: 0 0 10px 3px rgba(255,60,60,.75), 0 0 26px 6px rgba(255,0,0,.45); }
  50%      { box-shadow: 0 0 20px 7px rgba(255,80,80,1), 0 0 46px 14px rgba(255,0,0,.65); }
}
.hcard.bondglow .hcard-inner { border-color: #4ade80; animation: greenpulse 1.3s ease-in-out infinite; }
@keyframes greenpulse {
  0%,100% { box-shadow: 0 0 10px 3px rgba(60,220,110,.65), 0 0 24px 6px rgba(0,255,100,.35); }
  50%      { box-shadow: 0 0 18px 6px rgba(60,240,120,.95), 0 0 40px 10px rgba(0,255,100,.5); }
}
.hcard .top-info { position: absolute; top: 3px; left: 3px; right: 3px; display: flex; justify-content: space-between; z-index: 2; font-size: 10px; }
.hcard .type-tag { padding: 1px 6px; border-radius: 99px; font-weight: 800; background: rgba(0,0,0,.55); }
.hcard .type-tag.bun { background: #ec4899; }
.hcard .type-tag.evt { background: #8b5cf6; }
.hcard .bot-info { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(0deg, rgba(0,0,0,.85), transparent); padding: 10px 4px 3px; z-index: 2; font-size: 10px; }
.hcard .fv { color: #fde047; font-weight: 900; float: left; }
.hcard .lv { color: #6ee7b7; font-weight: 700; float: right; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; min-height: 40px; }
.gbtn { padding: 9px 18px; border: none; border-radius: 11px; font-size: 14px; font-weight: 800; cursor: pointer; transition: .12s; color: #fff; }
.gbtn:active { transform: scale(.94); }
.gbtn:disabled { opacity: .35; cursor: not-allowed; }
.gbtn.draw { background: linear-gradient(90deg,#14b8a6,#06b6d4); }
.gbtn.play { background: linear-gradient(90deg,#f59e0b,#ea580c); }
.gbtn.bun { background: linear-gradient(90deg,#ec4899,#e11d48); }
.gbtn.place { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); }
.gbtn.end { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); }
.gbtn.counter { background: linear-gradient(90deg,#ef4444,#dc2626); }
.gbtn.bond { background: linear-gradient(90deg,#d946ef,#a21caf); }
.gbtn.settle { background: linear-gradient(90deg,#f59e0b,#ea580c); }
.gbtn.fx { background: #475569; }

/* 左侧信息栏 */
#sideInfo { position: fixed; left: 12px; top: 76px; width: 300px; max-height: calc(100vh - 300px); overflow-y: auto; z-index: 120; background: rgba(2,6,23,.94); border: 1px solid rgba(251,191,36,.4); border-radius: 14px; padding: 14px; display: none; box-shadow: 0 14px 50px rgba(0,0,0,.6); }
#sideInfo.show { display: block; animation: fadein .2s; }
#sideInfo .si-img { width: 100%; height: 250px; border-radius: 10px; overflow: hidden; border: 3px solid rgba(251,191,36,.5); }
#sideInfo .si-img img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
#sideInfo h3 { font-size: 20px; margin: 10px 0 6px; }
.si-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.si-tags span { font-size: 10px; padding: 2px 9px; border-radius: 99px; background: rgba(255,255,255,.1); }
.si-tags .fv { background: rgba(250,204,21,.2); color: #fde047; font-weight: 800; }
.si-tags .lv { background: rgba(16,185,129,.2); color: #6ee7b7; font-weight: 800; }
.si-sec { margin-bottom: 9px; }
.si-sec .t { font-size: 10px; color: rgba(255,255,255,.5); margin-bottom: 3px; }
.si-sec .v { font-size: 12.5px; line-height: 1.6; background: rgba(255,255,255,.05); border-radius: 8px; padding: 8px 10px; }
.si-sec.counter .v { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25); }
@keyframes fadein { from { opacity: 0; } }
/* 弃牌区查看 */
#discardView { position: fixed; inset: 0; z-index: 95; background: rgba(0,0,0,.8); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; }
#discardView.show { display: flex; animation: fadein .2s; }
.dv-box { width: min(880px, 92vw); max-height: 84vh; overflow-y: auto; background: rgba(15,23,42,.96); border: 1px solid rgba(255,255,255,.15); border-radius: 16px; padding: 18px; }
.dv-title { font-size: 16px; font-weight: 900; margin-bottom: 12px; color: #fbbf24; }
#bigModal { position: fixed; inset: 0; z-index: 96; background: rgba(0,0,0,.8); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; }
#bigModal.show { display: flex; animation: fadein .2s; }
.dlg { display: flex; flex-wrap: wrap; justify-content: center; text-align: center; color: #fff; flex-direction: column; align-items: center; }
.dlg-close { margin-top: 12px; padding: 8px 22px; border: none; border-radius: 8px; background: #475569; color: #fff; font-weight: 700; cursor: pointer; }
.dlg-close:hover { background: #64748b; }
.dv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.dv-grid img { width: 100%; aspect-ratio: 3/4.2; object-fit: cover; object-position: top; border-radius: 8px; border: 2px solid rgba(255,255,255,.25); cursor: pointer; transition: .15s; }
.dv-grid img:hover { transform: scale(1.08); border-color: #fde047; }
/* 右侧玩家列表 */
#plist { position: fixed; right: 10px; top: 56px; width: 198px; z-index: 40; background: rgba(2,6,23,.86); border: 1px solid rgba(251,191,36,.32); border-radius: 14px; padding: 10px 10px 6px; backdrop-filter: blur(5px); max-height: calc(100vh - 260px); overflow-y: auto; }
#plist .pl-title { font-size: 12px; color: #fbbf24; font-weight: 800; margin-bottom: 8px; letter-spacing: 1px; }
.pl-row { position: relative; display: flex; align-items: center; gap: 7px; padding: 7px 8px; border-radius: 10px; margin-bottom: 6px; background: rgba(255,255,255,.05); border: 1px solid transparent; overflow: hidden; }
.pl-row.cur { border-color: #fbbf24; background: rgba(251,191,36,.14); box-shadow: 0 0 14px rgba(251,191,36,.25); }
.pl-row.dead { opacity: .4; }
.pl-row.full { border-color: rgba(244,114,182,.75); background: rgba(244,114,182,.14); }
.pl-main { flex: 1; min-width: 0; }
.pl-nm { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-turn { color: #fbbf24; font-size: 10px; font-weight: 800; margin-left: 4px; }
.pl-stats { font-size: 11px; color: rgba(255,255,255,.72); margin-top: 2px; }
@keyframes heartfloat { 0% { transform: translateY(6px) scale(.5); opacity: 0; } 22% { opacity: 1; } 100% { transform: translateY(-42px) scale(1.35); opacity: 0; } }
.pl-hearts { position: absolute; right: 2px; top: 4px; bottom: 0; width: 42px; pointer-events: none; }
.pl-hearts i { position: absolute; bottom: 2px; font-style: normal; font-size: 13px; animation: heartfloat 1.7s ease-in infinite; text-shadow: 0 0 8px rgba(244,114,182,.9); }
.dv-empty { color: rgba(255,255,255,.5); font-size: 13px; }
/* 反击特效 */
.counter-overlay { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(239,68,68,.35), rgba(0,0,0,.72)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; animation: fadein .15s; }
.counter-title { font-size: 34px; font-weight: 900; color: #fca5a5; letter-spacing: .25em; text-shadow: 0 0 30px rgba(239,68,68,1); animation: countershake .6s .25s; }
.counter-big { width: 210px; height: 300px; border-radius: 16px; overflow: hidden; border: 4px solid #ef4444; box-shadow: 0 0 70px rgba(239,68,68,.7); animation: counterin .5s cubic-bezier(.2,.9,.3,1); }
.counter-big img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.counter-name { font-size: 18px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,.9); }
@keyframes counterin { 0% { transform: scale(2.2) rotate(8deg); opacity: 0; } 55% { transform: scale(.95) rotate(-2deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
@keyframes countershake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }

/* 特效层 */
#fx-layer { position: fixed; inset: 0; z-index: 90; pointer-events: none; }
.shuffle-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.65); display: flex; align-items: center; justify-content: center; }
.shuffle-title { font-size: 44px; font-weight: 900; letter-spacing: .3em; text-shadow: 0 0 30px rgba(251,191,36,.9); animation: shuftitle 1.8s forwards; }
@keyframes shuftitle { 0% { opacity: 0; transform: scale(.6); } 30% { opacity: 1; transform: scale(1.1); } 45% { transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
.fly-card { position: absolute; left: 50%; top: 46%; width: 72px; height: 100px; border-radius: 10px; border: 2px solid rgba(251,191,36,.6); background: linear-gradient(135deg,#0f766e,#134e4a); animation: flyto .4s ease-in forwards; }
@keyframes flyto { 0% { transform: translate(-50%,-50%) scale(.7) rotate(-10deg); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(-50%, calc(-50% + var(--ty,220px))) scale(.4) rotate(10deg); opacity: 0; } }
.play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: flex; flex-direction: column; align-items: center; justify-content: center; animation: fadein .2s; }
.play-big { width: 230px; height: 330px; border-radius: 16px; overflow: hidden; border: 4px solid #fde047; box-shadow: 0 0 70px rgba(251,191,36,.55); animation: playcard .8s cubic-bezier(.2,.9,.3,1); }
.play-big img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
@keyframes playcard { 0% { transform: scale(.15) rotate(-35deg) translateY(-120px); opacity: 0; filter: blur(10px); } 60% { transform: scale(1.08) rotate(4deg); opacity: 1; filter: blur(0); } 100% { transform: scale(1) rotate(0); } }
.play-name { margin-top: 18px; font-size: 22px; font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,.9); }
.bond-overlay { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(251,191,36,.3), rgba(0,0,0,.6)); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
.bond-title { font-size: 40px; font-weight: 900; color: #fde68a; letter-spacing: .25em; text-shadow: 0 0 40px rgba(251,191,36,1); animation: bondtitle 1.6s cubic-bezier(.2,.8,.3,1); }
.bond-cards { display: flex; gap: 10px; }
.bond-cards img { width: 90px; height: 126px; border-radius: 10px; border: 3px solid #fde047; box-shadow: 0 0 26px rgba(251,191,36,.6); animation: bondpop .5s backwards; }
@keyframes bondtitle { 0% { opacity: 0; transform: scale(.4); } 50% { transform: scale(1.18); } 100% { opacity: 1; transform: scale(1); } }
@keyframes bondpop { from { opacity: 0; transform: translateY(60px) scale(.5); } }
.win-overlay { position: fixed; inset: 0; z-index: 120; background: rgba(0,0,0,.85); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; flex-direction: column; }
.win-overlay.show { display: flex; }
.win-emoji { font-size: 80px; animation: bounce 1.2s infinite; }
.win-name { font-size: 46px; font-weight: 900; color: #fde047; text-shadow: 0 0 50px rgba(251,191,36,.8); margin: 12px 0 4px; animation: wintitle 1s cubic-bezier(.2,.9,.3,1); }
.win-sub { color: rgba(255,255,255,.8); font-size: 18px; }
.win-btn { margin-top: 30px; padding: 12px 36px; border: none; border-radius: 12px; background: linear-gradient(90deg,#f59e0b,#ea580c); color: #fff; font-size: 16px; font-weight: 900; cursor: pointer; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
@keyframes wintitle { 0% { opacity: 0; transform: scale(.3); } 55% { transform: scale(1.15); } 100% { opacity: 1; transform: scale(1); } }
.confetti { position: absolute; font-size: 26px; animation: confetti linear infinite; }
@keyframes confetti { 0% { transform: translateY(-60px) rotate(0); } 100% { transform: translateY(110vh) rotate(680deg); } }

/* 日志 */
#logbox { position: fixed; left: 10px; bottom: 235px; z-index: 25; width: 250px; max-height: 170px; overflow: hidden; font-size: 11px; color: rgba(255,255,255,.55); pointer-events: none; }
#logbox div { line-height: 1.7; text-shadow: 0 1px 3px #000; }
#logbox .hl { color: #fde047; }

/* toast */
#toasts { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 110; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { padding: 9px 20px; border-radius: 10px; font-size: 13px; font-weight: 700; background: rgba(15,23,42,.95); box-shadow: 0 8px 24px rgba(0,0,0,.5); animation: toastin .25s; }
.toast.err { background: rgba(239,68,68,.92); }
.toast.gold { background: linear-gradient(90deg,#f59e0b,#f97316); color: #fff; }
@keyframes toastin { from { opacity: 0; transform: translateY(-14px) scale(.9); } }

/* 效果执行面板 */

function counterFits(cc, tc) {
  if (!cc || !cc.counter) return false;
  const txt = String(cc.counter).replace(/\s/g,'');
  const tAttr = (tc && tc.attr) || '', tRace = (tc && tc.race) || '';
  // 属性·种族组合，如「雪域·兽族效果发动时」
  const m2 = txt.match(/(雪域|沙漠|林原|海洋)·(兽族|鸟族)效果发动/);
  if (m2) return tAttr === m2[1] && tRace.startsWith(m2[2].charAt(0));
  // 属性限制，如「沙漠属性角色效果发动时」「林原角色牌效果发动时」「雪域或林原角色牌效果发动时」「任意玩家发动雪域属性角色牌效果时」
  const m1 = txt.match(/(雪域|沙漠|林原|海洋)((?:或|、)(?:雪域|沙漠|林原|海洋))*(?:属性)?角色牌?效果(?:发动)?时?/);
  if (m1) return m1[0].split(/(?:属性)?角色牌?效果(?:发动)?时?/)[0].split(/或|、/).indexOf(tAttr) > -1;
  // 种族限制，如「兽族角色牌效果发动时」「鸟族角色牌效果发动时」
  const m3 = txt.match(/(兽族|鸟族)角色牌?效果发动/);
  if (m3) return tRace.startsWith(m3[1].charAt(0));
  return true;
}

function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// 内置中继服务器地址（本地调试可用 ?srv=ws://localhost:9090 覆盖）
const DEFAULT_SRV = 'wss://kapari-game-relay.onrender.com';
function srvUrl() {
  try { const q = new URLSearchParams(location.search).get('srv'); if (q && /^wss?:\/\//.test(q)) return q; } catch(_) {}
  return DEFAULT_SRV;
}
function netConnect(done, fail) {
  const url = srvUrl();
  if (!/^wss?:\/\//.test(url)) { fail('请先填写服务器地址（wss://…，本地测试 ws://localhost:9090）'); return; }
  let ws;
  try { ws = new WebSocket(url); } catch(e) { fail('无法创建连接：'+e.message); return; }
  NET.ws = ws;
  ws.onopen = () => done();
  ws.onerror = () => { if (ws.readyState !== 1) fail('连接服务器失败，请检查地址'); };
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch(_) { return; } try { netMsg(m); } catch(err) { console.error('netMsg', err); } };
  ws.onclose = () => { if (NET.on && !NET.quiet && NET.started) toast('⚠ 与服务器断开连接','err'); };
}
function netSend(o) { if (NET.ws && NET.ws.readyState === 1) NET.ws.send(JSON.stringify(o)); }
function sendAct(a, v) { netSend({ t:'act', a, v: v||{} }); }

function netMsg(m) {
  if (m.t === 'err') { connTip(m.msg); toast(m.msg, 'err'); return; }
if (m.t === 'joined') {
NET.on = true; NET.room = m.room; NET.pid = m.pid; NET.token = m.token; NET.hostPid = m.host; NET.members = m.members || []; NET.started = !!m.started;
HOST = (m.pid === m.host); // 以服务器判定为准，防止残留的幽灵房主标志
    localStorage.setItem('kp_tok_'+m.room, m.token);
    document.getElementById('lobbyBox').style.display = 'block';
    document.getElementById('roomShow').textContent = m.room;
    renderMemberList();
    if (m.started) { // 断线重连
      document.getElementById('menu').style.display = 'none';
      document.getElementById('game').style.display = 'block';
      toast('已重新连接对局','gold');
    }
    return;
  }
  if (m.t === 'lobby') {
    NET.members = m.members; NET.hostPid = m.host;
    renderMemberList();
    if (HOST && S) { syncAiFlags(); publishState(); }
    return;
  }
  if (m.t === 'starting') {
    if (HOST) return;
    NET.started = true;
    document.getElementById('menu').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    setHint('房主已开始游戏，等待发牌…','gold');
    return;
  }
  if (m.t === 'act') { if (HOST) applyAct(m.from, m.a, m.v); return; }
  if (m.t === 'g') { if (!HOST && m.d && m.d.k === 'evt') clientEvt(m.d); return; }
  if (m.t === 'gto') {
    if (HOST || m.to !== NET.pid) return;
    const d = m.d || {};
    if (d.k === 'snap') applySnap(d.s);
    else if (d.k === 'fxAsk') clientFxAsk(d.step);
    else if (d.k === 'reveal') clientReveal(d);
    return;
  }
  if (m.t === 'bye') { if (HOST) onMemberLeft(m.pid); else toast('有玩家掉线，AI 已接管','err'); return; }
  if (m.t === 'hostlost') { toast('⚠ 房主断线，对局无法继续','err'); showHostLost(); return; }
}

function shuffle(a) { a = a.slice(); for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// ============ 开局（联机：从房间成员构建玩家） ============
function startGameMp(members) {
  myId = NET.pid;
  NET.started = true;
  const players = members.map(x => ({ id: x.pid, name: x.name, ai: !!x.offline, alive: true, declared: false, declareTurn: -1, hand: [], counters: 0, slots: mkSlots(), skip:0, extraPlay:0, pendDiscard:0, poison:null, flags:{restrict:{},protect:{},mark:{}}, track:{attrs:[],instant:false} }));
  // 牌库
  const deck = []; let seq = 0;
  CARDS.forEach(c => {
    if (c.type === '角色牌') { deck.push(c.id+'#'+(seq++), c.id+'#'+(seq++)); }
    else if (c.type === '事件牌') deck.push(c.id+'#'+(seq++));
    else for (let k=0;k<6;k++) deck.push(c.id+'#'+(seq++));
  });
  S = { players, order: shuffle(players.map(p=>p.id)), turnIdx: 0, phase: 'draw',
    deck: shuffle(deck), discard: [], actionUsed: false, eventUsed: false,
    resolve: null, threshold: players.length >= 5 ? 30 : 25, turns: 0, winner: null,
    roundNo: 0, gflags: {}, tableStack: [], tableBuns: [], aside: [], partner: null, counterDrawUsed: false, logArr: [] };
  document.getElementById('menu').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  showShuffle(() => {
    // 发牌
    let dealAnims = [];
    for (let r=0;r<5;r++) for (const pid of S.order) { const inst = S.deck.pop(); P(pid).hand.push(inst); dealAnims.push({to:pid, card:inst}); }
    playDealAnims(dealAnims, () => {
      log('🎲 洗牌完成，公共牌堆 '+S.deck.length+' 张', true);
      log('每人5张起始手牌 · 胜利门槛 '+S.threshold+' 友情值');
      render();
      toast('游戏开始！'+cur().name+' 先手', 'gold');
      publishState();
      nextTurnBegin();
    });
  });
}

// ============ 回合流程 ============
function nextTurnBegin() {
  clearTimers();
  selInst = null; mode = null; bondSel = [];
  const c = cur();
  // 出局（skip）处理
  if (c.skip > 0) {
    c.skip--;
    log('⏭ '+c.name+' 出局中，跳过本回合');
    toast(c.name+' 出局中，跳过回合');
    S.turns++;
    let idx = S.turnIdx;
    for (let k=0;k<S.order.length;k++) { idx = (idx+1)%S.order.length; if (P(S.order[idx]).alive) break; }
    S.turnIdx = idx;
    S.phase = 'draw'; S.actionUsed = false; S.eventUsed = false;
    const alive = S.order.filter(id=>P(id).alive);
    if (alive.length <= 1) { doWin(P(alive[0])); return; }
    nextTurnBegin();
    return;
  }
  // 月夜访客桌面牌
  if (S.tableStack.length) {
    const inst = S.tableStack.splice(Math.floor(Math.random()*S.tableStack.length),1)[0];
    const cd = cardOf(inst);
    toast('🌙 月夜访客：'+c.name+' 翻开了「'+cd.name+'」！','gold');
    log('🌙 桌面牌发动：'+c.name+' 抽1张，其他玩家各弃1张');
    const me = P(myId);
    S.players.filter(p=>p.alive&&p.id!==c.id).forEach(p=>{ for(let i=0;i<1&&p.hand.length;i++) S.discard.push(p.hand.splice(Math.floor(Math.random()*p.hand.length),1)[0]); });
    const gi = S.deck.pop(); if (gi) c.hand.push(gi);
    S.discard.push(inst);
  }
  render();
  // 回合开始效果：毒/自动放置/额外出牌/桌面馒头提示
  if (c.poison) {
    for (let i=0;i<c.poison.per && c.hand.length;i++) { const inst=c.hand.splice(Math.floor(Math.random()*c.hand.length),1)[0]; S.discard.push(inst); }
    log('☠ 白色霞水母毒素：'+c.name+' 弃了 '+c.poison.per+' 张');
    c.poison.turns--; if (c.poison.turns<=0) c.poison = null;
  }
  if (c.flags.mark.autoPlace) {
    const roles = c.hand.filter(h=>cardOf(h).type==='角色牌');
    if (roles.length && usable(c)>0) { const best = roles.sort((x,y)=>cardOf(y).fv-cardOf(x).fv)[0]; place(c.id, best, freeSlotIdx(c), true); log('🐺 非洲金狼：'+c.name+' 自动放置了「'+cardOf(best).name+'」'); }
  }
  if (c.extraPlayNext) { c.extraPlay += c.extraPlayNext; c.extraPlayNext = 0; }
  if (c.flags.mark.extraPlayRound) c.extraPlay += 1;
  if (c.ai) { aiTimers.push(setTimeout(()=>aiTurn(c), 900)); }
  else { toast('轮到你了，请抽牌', 'gold'); if (S.tableBuns.length) toast('桌面有馒头可领取（见按钮）'); }
}
function doDraw(pid) {
  const p = P(pid);
  // 收获之秋：跳过抽牌，改用牌堆顶盖放
  if (p.harvest) {
    const gi = S.deck.pop(); if (gi) p.harvest.covered.push(gi);
    p.harvest.turns--;
    log('🍂 收获之秋：'+p.name+' 跳过抽牌，牌堆顶1张盖放');
    if (p.harvest.turns <= 0) {
      p.hand.push(...p.harvest.stack, ...p.harvest.covered);
      log('🍂 '+p.name+' 收回了全部盖放的手牌');
      p.harvest = null;
    }
    S.phase = 'action'; S.actionUsed = false; S.eventUsed = false;
    render();
    if (p.ai) aiTimers.push(setTimeout(()=>aiAction(p), 800));
    return;
  }
  const inst = S.deck.pop();
  if (inst) { p.hand.push(inst); flyCard(pid===myId?'me':'ai', ()=>{}); log(p.name+' 抽了1张牌'); }
  S.phase = 'action'; S.actionUsed = false; S.eventUsed = false;
  render();
  if (p.ai) aiTimers.push(setTimeout(()=>aiAction(p), 800));
}
// 打出角色/事件牌
function playCard(pid, instId) {
  const p = P(pid); const card = cardOf(instId);
  rmHand(p, instId);
  p.track.attrs.push((card.attr||'')+(card.race||''));
  p.track.instant = true;
  S.counterDrawUsed = false;
  S.resolve = { kind: card.type==='事件牌'?'event':'instant', card: instId, initiator: pid, chain: [], bunUsed: 0, claimed: false };
  // 惩罚标记（327/328）
  S.players.forEach(pp => {
    if (!pp.alive) return;
    const mk = pp.flags.mark;
    if (mk['punish林原兽类'] && card.attr==='林原' && card.race==='兽类') { punishDiscard(pp); }
    if (mk['punish沙漠兽类'] && card.attr==='沙漠' && card.race==='兽类') { punishDiscard(pp); }
  });
  showPlayFX(card, p.name, () => {
    log('⚡ '+p.name+' 打出「'+card.name+'」', true);
    render();
    resolveWindow();
  });
}
function punishDiscard(p) { if (p.hand.length) { const inst=p.hand.splice(Math.floor(Math.random()*p.hand.length),1)[0]; S.discard.push(inst); toast('☠ '+p.name+' 触发惩罚标记，弃1张','err'); log('☠ '+p.name+' 弃1张（惩罚标记）'); } }
// 打出馒头
function playBun(pid, instId) {
  const p = P(pid); const card = cardOf(instId);
  rmHand(p, instId);
  if (S.resolve && !S.resolve.claimed) {
    // 馒头截断连锁：立即结算，不能再发动任何卡牌

// 放置到友情区
function place(pid, instId, slotIdx, faceUp) {
  const p = P(pid); const card = cardOf(instId);
  rmHand(p, instId);
  const s = p.slots[slotIdx];
  s.inst = instId; s.faceUp = faceUp !== false;
  // 飞鱼：放置时友情值=手牌数×2
  if (card.id === 390) s.fvOverride = p.hand.length * 2;
  log('📥 '+p.name+' 将「'+card.name+'」'+(s.faceUp?'放置':'盖放')+'在友情区');
  // 人面鱼 / 剑齿虎 全局标记
  const gf = S.gflags;
  if (gf.placeDraw && gf.placeDraw.rounds > 0 && gf.placeDraw.pid !== pid) { const gi=S.deck.pop(); if(gi){p.hand.push(gi); log('🐟 人面鱼：'+p.name+' 抽1张');} }
  if (gf.placeCover && gf.placeCover.rounds > 0) {
    const occ = p.slots.filter(x=>x.inst&&x.faceUp);
    if (occ.length) { const t=occ[Math.floor(Math.random()*occ.length)]; t.faceUp=false; t.coverTurns=2; log('🐯 剑齿虎：'+p.name+' 盖放1张友情区牌'); }
  }
  render();
}
function rmHand(p, instId) { const i = p.hand.indexOf(instId); if (i>-1) p.hand.splice(i,1); }

// ============ 羁绊判定（同一羁绊≥2张） ============
function sharedBond(playedCard, handIds) {
  if (!handIds || handIds.length < 1) return null;
  for (const b of (playedCard.bonds||[])) {
    if (handIds.every(h => (cardOf(h).bonds||[]).includes(b))) return b;
  }
  return null;
}
function isBondCand(inst) {
  if (!S.resolve || S.resolve.initiator === myId) return false;
  const played = cardOf(S.resolve.card);
  if (!played || played.type !== '角色牌' || S.resolve.claimed) return false;
  const bondSet = new Set(played.bonds||[]);
  return (cardOf(inst).bonds||[]).some(b=>bondSet.has(b));
}
// AI 找最优羁绊组合（打出牌+若干手牌同属一个羁绊，总数≥2）
function bestBondCombo(ai, played) {
  let best = null;
  for (const b of (played.bonds||[])) {
    const cands = ai.hand.filter(h => (cardOf(h).bonds||[]).includes(b));
    for (let k = cands.length; k >= 1; k--) {
      const combo = cands.slice(0, k);
      if (usable(ai) < combo.length + 1) continue;
      const fv = combo.reduce((s,h)=>s+(cardOf(h).fv||0),0) + (played.fv||0);
      if (!best || fv > best.fv) best = { bond: b, handIds: combo, fv };
      break; // 该羁绊下最多张
    }
  }
  return best;
}

// ============ 结算窗口（联机统一：人类出牌→AI先反应；其余人类玩家有60s反应窗口） ============
function resolveWindow() {
  const r = S.resolve; if (!r) return;
  const initiator = P(r.initiator);
  if (!initiator.ai) aiReactToHuman();          // 人类出牌 → AI 玩家立即反应（反击/羁绊）
  if (!S.resolve) { publishState(); return; }
  if (S.resolve.claimed) { render(); publishState(); return; }  // 已被羁绊收集，doClaim 里继续结算
  const waiting = S.players.filter(p => p.alive && !p.ai && p.id !== r.initiator);
  if (S.resolve.chain.some(ch=>ch.kind==='counter')) {
    // 已有反击 → 开启连锁反应窗口（可反击反击 / 馒头截断 / 结算）
    startResolveCountdown(30); render();
  } else if (!waiting.length) { startEffect(); } // 没有其他人类玩家 → 直接结算
  else { startResolveCountdown(60); render(); }
  publishState();
}

      const cIdx = ai.hand.findIndex(h => cardOf(h).counter && counterFits(cardOf(h), card));
      if (cIdx > -1) {
const cInst = ai.hand[cIdx]; rmHand(ai, cInst); ai.counters++;
r.chain.push({card:cInst, by:ai.id, kind:'counter'});
toast(ai.name+' 发动反击「'+cardOf(cInst).name+'」！', 'err');

function aiReactToCounter() {
  const r = S.resolve; if (!r || r.claimed) return;

    if (!lastCnt) break;
    const lastCard = cardOf(lastCnt.card);
    for (const ai of S.players.filter(p=>p.ai && p.alive && p.id!==lastCnt.by)) {

      if (Math.random() < 0.2 && ai.counters < 2) {

          toast(ai.name+' 连锁反击「'+cardOf(cInst).name+'」！', 'err');

function aiResolveStep(st) {
  const ctx = PFX.ctx;
  const type = st[0], arg = st[1];
  const others = S.players.filter(p=>p.alive && p.id!==ctx.actor);
  const pickFrom = (filter) => {
    let cands = others.filter(p => !filter || filter(p.id));
    if (!cands.length) cands = others;
    if (!cands.length) cands = [P(ctx.actor)];
    // AI 优先打人类，其次随机
    const hum = cands.find(p=>!p.ai);
    const pick = hum || cands[Math.floor(Math.random()*cands.length)];
    return pick ? pick.id : ctx.actor;
  };
  if (type==='t') ctx.t = pickFrom(arg);
  else if (type==='t2') { let ex = ctx.t; ctx.t2 = pickFrom(pid=>pid!==ex); }
  else if (type==='h') { const n = Math.min(arg, P(ctx.actor).hand.length); ctx.h = P(ctx.actor).hand.slice(0,n); }
  else if (type==='hv') { const t=P(ctx.t); const n=Math.min(arg||1, t?t.hand.length:0); ctx.hv = t ? t.hand.slice(0,n) : []; }
  else if (type==='coin') ctx.coin = Math.random()<0.5;
  else if (type==='rps') ctx.rps = Math.random()<0.5;
  else if (type==='ar') ctx.ar = { a: ATTRS[Math.floor(Math.random()*4)], r: RACES[Math.floor(Math.random()*3)] };
  else if (type==='a') ctx.attr = ATTRS[Math.floor(Math.random()*4)];
  else if (type==='deckpick') { ctx.picked = S.deck[S.deck.length-1]; }
  else if (type==='guessHand') ctx.guess = { inst: P(ctx.t)?P(ctx.t).hand[0]:null, a: ATTRS[Math.floor(Math.random()*4)], r: RACES[Math.floor(Math.random()*3)] };
  else if (type==='guessTotal') ctx.guess = 3;
  PFX.i++; setTimeout(fxStep, 300);
}

// ============ 效果 API 原语 ============
function reshuffleDeck() {
  if (S.deck.length || !S.discard.length) return;
  S.deck = shuffle(S.discard); S.discard = [];
  toast('弃牌区洗回牌堆','gold'); log('♻ 牌堆耗尽，弃牌区重新洗切');
}
function drawCards(pid, n) {
  const p = P(pid); let got = 0;
  for (let i=0;i<n;i++) {
    if (!S.deck.length) reshuffleDeck();
    const inst = S.deck.pop(); if (!inst) break;
    p.hand.push(inst); got++;
  }
  if (got) { log(p.name+' 抽了 '+got+' 张牌'); if (pid===myId) flyCard('me', ()=>{}); }
  render();
}
function randomSplice(arr) { return arr.length ? arr.splice(Math.floor(Math.random()*arr.length),1)[0] : null; }
function discardFrom(pid, n) {
  const p = P(pid); let done = 0;
  for (let i=0;i<n && p.hand.length;i++) { S.discard.push(randomSplice(p.hand)); done++; }
  if (done) log(p.name+' 被弃置 '+done+' 张手牌');
  render();
}
function makeAPI(actorId, ctx) {
  const ID = x => (x && typeof x==='object' && typeof x.id==='string') ? x.id : x;
  const A = {
    // 基础
    players: () => S.players.filter(p=>p.alive),
    allPlayers: fn => S.players.filter(p=>p.alive).forEach(fn),
    allOthers: (pid, fn) => S.players.filter(p=>p.alive&&p.id!==pid).forEach(fn),
    randomPlayer: f => { const c=S.players.filter(p=>p.alive&&(!f||f(p.id))); return c.length?c[Math.floor(Math.random()*c.length)].id:null; },
    nextPlayer: pid => { const i=S.order.indexOf(pid); for(let k=1;k<=S.order.length;k++){const q=P(S.order[(i+k)%S.order.length]); if(q.alive&&q.id!==pid) return q.id;} return pid; },
    handCount: pid => P(pid).hand.length,
    zoneCount: pid => P(pid).slots.filter(s=>s.inst).length,
    zoneAttrCount: (pid,attr) => P(pid).slots.filter(s=>s.inst&&cardOf(s.inst).attr===attr).length,
    track: (pid, key) => { const t = P(ID(pid)).track; return key==='instant' ? t.instant : t.attrs; },
    note: t => { log('ℹ '+t); },
    discardedName: nm => S.discard.concat(S.tableStack).filter(i=>cardOf(i).name===nm).length,
    viewHand: pid => { const t = P(pid); if (actorId === myId) showHandModal(t, 0, false); else if (!P(actorId).ai) netSend({t:'gto', to:actorId, d:{k:'reveal', name:t.name, cards:t.hand.map(x=>cardOf(x).id)}}); log('查看了 '+t.name+' 的手牌'); },
    targetHasAttr: (pid, attr) => P(pid).hand.some(h=>cardOf(h).attr===attr) || P(pid).slots.some(s=>s.inst&&cardOf(s.inst).attr===attr),
    // 抽/弃/偷/给
    draw: (pid,n) => drawCards(pid,n),
    discardR: (pid,n) => discardFrom(pid,n),
    discardC: (pid,insts) => { const p=P(pid); (insts||[]).forEach(inst=>{ rmHand(p,inst); S.discard.push(inst); }); log(p.name+' 弃置了 '+(insts||[]).length+' 张手牌'); render(); },
    discardAll: pid => { const p=P(pid); p.hand.forEach(i=>S.discard.push(i)); const n=p.hand.length; p.hand=[]; log(p.name+' 弃置全部手牌（'+n+'张）'); render(); },
    mill: n => { for(let i=0;i<n&&S.deck.length;i++) S.discard.push(S.deck.pop()); log('牌堆顶 '+n+' 张进入弃牌区'); render(); },
    fromBottom: n => { const p=P(actorId); let got=0; for(let i=0;i<n&&S.deck.length;i++){ p.hand.unshift(S.deck.shift()); got++; } log(p.name+' 从牌堆底摸了 '+got+' 张'); render(); },
    gainPicked: (pid,inst) => { if(!inst) return; const di=S.deck.indexOf(inst); if(di>-1) S.deck.splice(di,1); P(pid).hand.push(inst); log(P(pid).name+' 从牌堆顶选取了「'+cardOf(inst).name+'」加入手牌'); render(); },
    reclaim: n => { const p=P(actorId); let got=0; for(let i=0;i<n&&S.discard.length;i++){ p.hand.push(S.discard.pop()); got++; } log(p.name+' 从弃牌区回收了 '+got+' 张'); render(); },
    reclaimBonded: (pid,n) => { const p=P(pid); const cands=S.discard.filter(i=>{ const b=cardOf(i).bonds||[]; return p.slots.some(s=>s.inst&&(cardOf(s.inst).bonds||[]).some(x=>b.includes(x))); }); let got=0; for(let i=0;i<n&&cands.length;i++){ const inst=cands.splice(Math.floor(Math.random()*cands.length),1)[0]; const di=S.discard.indexOf(inst); if(di>-1){ S.discard.splice(di,1); p.hand.push(inst); got++; } } log(p.name+' 回收了 '+got+' 张同羁绊牌'); render(); },
    copyFromDiscard: pid => { const roles=S.discard.filter(i=>cardOf(i).type==='角色牌'); if(!roles.length){A.note('弃牌区没有角色牌');return;} const best=roles.sort((a,b)=>cardOf(b).fv-cardOf(a).fv)[0]; S.discard.splice(S.discard.indexOf(best),1); P(pid).hand.push(best); log('🦎 变色龙复制了「'+cardOf(best).name+'」'); render(); },
    stealR: (from,to,n) => { const f=P(from),t=P(to); let got=0; for(let i=0;i<n&&f.hand.length;i++){ t.hand.push(randomSplice(f.hand)); got++; } log(t.name+' 偷取了 '+f.name+' '+got+' 张手牌'); render(); },
    stealC: (from,to,insts) => { const f=P(from),t=P(to); (insts||[]).filter(Boolean).forEach(inst=>{ rmHand(f,inst); t.hand.push(inst); }); log(t.name+' 偷取了 '+f.name+' '+(insts||[]).length+' 张指定手牌'); render(); },
    stealAll: (from,to) => { const f=P(from),t=P(to); const n=f.hand.length; t.hand.push(...f.hand); f.hand=[]; log(t.name+' 偷取了 '+f.name+' 全部手牌（'+n+'张）'); render(); },
    give: (from,to,inst) => { if(!inst) return; const f=P(from); rmHand(f,inst); P(to).hand.push(inst); log(f.name+' 将1张手牌交给 '+P(to).name); render(); },
    giveRandom: (from,to) => { const f=P(from); const inst=randomSplice(f.hand); if(inst){ P(to).hand.push(inst); log(f.name+' 将1张随机手牌交给 '+P(to).name); } render(); },
    swapHands: (a,b) => { const x=P(a),y=P(b); const tmp=x.hand; x.hand=y.hand; y.hand=tmp; log(x.name+' 与 '+y.name+' 手牌互换'); render(); },
    swapWithTarget: (pid,inst,tid) => { if(!inst) return; const p=P(pid),t=P(tid); rmHand(p,inst); const back=randomSplice(t.hand); t.hand.push(inst); if(back) p.hand.push(back); log(p.name+' 与 '+t.name+' 交换了1张手牌'); render(); },
    // 友情区
    zoneDiscardR: pid => { const p=P(pid); let n=0; p.slots.forEach(s=>{ if(s.inst){ S.discard.push(s.inst); s.inst=null; s.fvOverride=null; n++; } }); log(p.name+' 友情区 '+n+' 张牌被丢弃'); render(); },
    zoneDiscardSelf: pid => { const p=P(pid); const idx=p.slots.findIndex(s=>s.inst); if(idx>-1){ S.discard.push(p.slots[idx].inst); p.slots[idx].inst=null; log(p.name+' 丢弃了友情区1张牌'); } render(); },
    zoneClear: pid => { const p=P(pid); let n=0; p.slots.forEach(s=>{ if(s.inst){ S.discard.push(s.inst); s.inst=null; n++; } }); log(p.name+' 友情区被清空（'+n+'张）'); render(); },
    zoneStealR: (from,to) => { const f=P(from),t=P(to); const idx=f.slots.findIndex(s=>s.inst); if(idx>-1){ const inst=f.slots[idx].inst; f.slots[idx].inst=null; const free=t.slots.findIndex(s=>!s.inst&&!s.locked); if(free>-1){ t.slots[free].inst=inst; log(t.name+' 夺走了 '+f.name+' 友情区的「'+cardOf(inst).name+'」'); } else S.discard.push(inst); } render(); },
    swapZoneR: (a,b) => { const x=P(a),y=P(b); const ix=x.slots.findIndex(s=>s.inst); const iy=y.slots.findIndex(s=>s.inst); if(ix>-1&&iy>-1){ const tmp=x.slots[ix].inst; x.slots[ix].inst=y.slots[iy].inst; y.slots[iy].inst=tmp; log(x.name+' 与 '+y.name+' 友情区1张牌互换'); } render(); },
    coverZoneR: (pid,n) => { const p=P(pid); let n2=0; for(let i=0;i<n;i++){ const gi=S.deck.pop(); if(!gi) break; const free=p.slots.findIndex(s=>!s.inst&&!s.locked); if(free<0){ S.discard.push(gi); break; } p.slots[free]={inst:gi,faceUp:false,coverTurns:2}; n2++; } log(p.name+' 友情区被盖放 '+n2+' 张牌'); render(); },
    coverHandToZone: pid => { const p=P(pid); const inst=randomSplice(p.hand); if(inst){ const free=p.slots.findIndex(s=>!s.inst&&!s.locked); if(free>-1){ p.slots[free]={inst,faceUp:false,coverTurns:2}; log(p.name+' 1张手牌被盖放在友情区'); } else p.hand.push(inst); } render(); },
    coverHandAside: (pid,n) => { const p=P(pid); for(let i=0;i<n&&p.hand.length;i++){ const inst=randomSplice(p.hand); if(inst){ p.slots.forEach(s=>{ if(s.inst===inst) s.inst=null; }); S.aside.push({pid,inst}); } } log(p.name+' 的 '+n+' 张手牌被移出游戏'); render(); },
    coverChosenToZone: (pid,inst) => { if(!inst) return; const p=P(pid); rmHand(p,inst); const free=p.slots.findIndex(s=>!s.inst&&!s.locked); if(free>-1){ p.slots[free]={inst,faceUp:false,coverTurns:2}; log(p.name+' 将1张手牌盖放在友情区'); } render(); },
    selfPlaceCovered: () => { const p=P(actorId); const free=p.slots.findIndex(s=>!s.inst&&!s.locked); if(free>-1){ p.slots[free]={inst:ctx.played,faceUp:false,coverTurns:2}; if(S.resolve) S.resolve.taken=null; log(p.name+' 将本牌盖放在自己友情区'); } render(); },
    flipAllCovered: () => { let n=0; S.players.forEach(p=>p.slots.forEach(s=>{ if(s.inst&&!s.faceUp){ s.faceUp=true; s.coverTurns=null; n++; } })); log('翻开全场所有盖放的牌（'+n+'张）'); render(); },
    clearAllCovered: () => { S.players.forEach(p=>p.slots.forEach(s=>{ if(s.inst&&!s.faceUp){ S.discard.push(s.inst); s.inst=null; } })); log('丢弃场上所有盖放的牌'); render(); },
    hasCovered: pid => P(pid).slots.some(s=>s.inst&&!s.faceUp),

function endTurn(pid) {
  if (S.resolve) { toast('请先完成结算','err'); return; }

  if (p.hand.length > 7) {
    if (p.ai) { // AI 弃随机
      const need = p.hand.length - 7;
      for (let i=0;i<need;i++) { const inst = p.hand.splice(Math.floor(Math.random()*p.hand.length),1)[0]; S.discard.push(inst); }
      log(p.name+' 弃置了 '+need+' 张手牌');
    } else {
      S.pendingDiscard = { need: p.hand.length - 7, pid: pid };
      mode = 'discard-limit'; bondSel = [];
      toast('手牌超上限！请弃置 '+S.pendingDiscard.need+' 张','err');
      render(); return;
    }
  }
  finishTurn(pid);
}
function finishTurn(pid) {
  const p = P(pid);
  S.pendingDiscard = null;
  // 待弃牌效果（335/353等）
  if (p.pendDiscard > 0) { const n = Math.min(p.pendDiscard, p.hand.length); for(let i=0;i<n;i++) S.discard.push(randomSplice(p.hand)); log('⏳ '+p.name+' 弃置了 '+n+' 张（延时效果）'); p.pendDiscard = 0; }
  // 出局判定
  if (p.alive && usable(p) < 3) {
    p.alive = false; p.hand.forEach(i=>S.discard.push(i)); p.hand = [];
    toast(p.name+' 可用格不足3个，出局了！','err');
    log('💀 '+p.name+' 出局', true);
  }
  // 亮眼判定（宣告后一整轮）
  if (p.declared && S.turns - p.declareTurn >= S.order.length) {
    if (zoneFv(p) >= S.threshold) { doWin(p); return; }
    p.declared = false; log(p.name+' 友情值跌出门槛，亮眼取消');
  }
  S.turns++;
  // ===== 回合结束钩子 =====
  // 小爪水獭成长：友情区每轮+1
  p.slots.forEach(s => { if (s.inst && cid(s.inst) === 333) s.bonus = (s.bonus||0) + 1; });
  // 盖放回合倒计
  S.players.forEach(pp => pp.slots.forEach(s => { if (s.inst && s.coverTurns) { s.coverTurns--; if (s.coverTurns <= 0 && s.faceUp===false) { /* 保留盖放，需翻开效果处理 */ } } }));
  // 全局标记衰减
  Object.keys(S.gflags).forEach(k => { S.gflags[k].rounds--; if (S.gflags[k].rounds <= 0) delete S.gflags[k]; });
  // 合作关系衰减
  if (S.partner) { S.partner.rounds--; if (S.partner.rounds <= 0) { log('🤝 合作关系结束'); S.partner = null; } }
  // 明暗交锋：未使用的盖放牌返回手牌
  if (S.aside.length) {
    const rest = S.aside.filter(x => x.lightDark);
    rest.forEach(x => { if (P(x.pid) && P(x.pid).alive) P(x.pid).hand.push(x.inst); });
    S.aside = S.aside.filter(x => !x.lightDark);
    if (rest.length) log('🌓 明暗交锋：盖放牌返回手牌');
  }
  // 个人标记/限制衰减
  S.players.forEach(pp => {
    ['restrict','protect','mark'].forEach(cat => {
      const o = pp.flags[cat]; Object.keys(o).forEach(k => { o[k]--; if (o[k] <= 0) delete o[k]; });
    });
    pp.extraPlay = 0;
  });
  // 新的一轮：重置出牌追踪
  if (S.turns % S.order.length === 0) {
    S.roundNo++;
    S.players.forEach(pp => { pp.track = { attrs: [], instant: false }; });
    log('—— 第 '+(S.roundNo+1)+' 轮开始 ——');
  }
  // 下一位
  let idx = S.turnIdx;
  for (let k=0;k<S.order.length;k++) { idx = (idx+1)%S.order.length; if (P(S.order[idx]).alive) break; }
  S.turnIdx = idx;
  S.players.forEach(pp => pp.counters = 0);
  S.phase = 'draw'; S.actionUsed = false; S.eventUsed = false;
  log('—— '+cur().name+' 的回合 ——');
  // 只剩一人
  const alive = S.order.filter(id=>P(id).alive);
  if (alive.length <= 1) { doWin(P(alive[0])); return; }
  nextTurnBegin();
}

  if (!S || S.phase !== 'action' || cur().id !== p.id) return;
  const card = inst => cardOf(inst);
  // 春日翢鸢锁
  if (p.flags.mark.lockHand5 && p.hand.length >= 5) { log(p.name+' 被锁手牌，无法出牌'); aiTimers.push(setTimeout(()=>endTurn(p.id), 600)); return; }
  const free = usable(p);
  const buns = p.hand.filter(h => card(h).type==='加帕里馒头');
  const solos = p.hand.filter(h => isSoloCard(card(h)) && card(h).type!=='加帕里馒头');
  const roles = p.hand.filter(h => card(h).type==='角色牌');
  const evts = p.hand.filter(h => card(h).type==='事件牌');
  let done = false;
  // 放置：仅限可单独放置的牌与馒头
  if (free > 3) {
    if (solos.length) { const best = solos.sort((a,b)=>card(b).fv-card(a).fv)[0]; place(p.id, best, freeSlotIdx(p)); done = true; }
    else if (buns.length > 2 && p.hand.length > 4) { place(p.id, buns[0], freeSlotIdx(p)); done = true; }
  }
  if (!done && !S.resolve) {
    if (roles.length && Math.random() < 0.55) { playCard(p.id, roles[Math.floor(Math.random()*roles.length)]); return; }
    if (evts.length && Math.random() < 0.6) { playCard(p.id, evts[Math.floor(Math.random()*evts.length)]); return; }
    if (buns.length > 0 && free > 2 && Math.random() < 0.5) { place(p.id, buns[0], freeSlotIdx(p)); done = true; }
  }
  if (!done && !S.resolve) { log(p.name+' 选择观望'); }
  if (!S.resolve) {
    // 宣告胜利
    if (!p.declared && zoneFv(p) >= S.threshold) { p.declared = true; p.declareTurn = S.turns; toast('🌟 '+p.name+' 宣告「交够了朋友」！','gold'); log('🌟 '+p.name+' 宣告亮眼', true); }
    aiTimers.push(setTimeout(()=>endTurn(p.id), 600));
  }
  render();
}

// ============ 房主核心：状态快照（手牌隐私）→ 定向发送 ============
function publishState() {
  if (!HOST || !NET.on || !S) return;
  if (pubT) return;
  pubT = setTimeout(() => { pubT = null; doPublish(); }, 60);
}
function doPublish() {
  if (!HOST || !NET.on || !S) return;
  for (const m of NET.members) {
    const p = P(m.pid);
    if (!p) continue;
    const snap = mkSnapshot(m.pid);
    netSend({ t:'gto', to: m.pid, d:{ k:'snap', s: snap } });
  }
}
function mkSnapshot(viewerPid) {
  const pub = {
    threshold: S.threshold, order: S.order, turnIdx: S.turnIdx, phase: S.phase,
    deckN: S.deck.length, discard: S.discard.slice(), actionUsed: S.actionUsed, eventUsed: S.eventUsed,
    resolve: S.resolve ? { kind: S.resolve.kind, card: cardOf(S.resolve.card).id, initiator: S.resolve.initiator, chain: (S.resolve.chain||[]).map(ch=>({card: cardOf(ch.card).id, by: ch.by, kind: ch.kind})), bunUsed: S.resolve.bunUsed, claimed: S.resolve.claimed } : null,
    turns: S.turns, winner: S.winner ? { id: S.winner, name: P(S.winner).name } : null,
    roundNo: S.roundNo, tableBuns: S.tableBuns.slice(), tableBunN: S.tableBuns.length,
    partner: S.partner, rzLeft, pendingDiscard: S.pendingDiscard && S.pendingDiscard.pid === viewerPid ? { need: S.pendingDiscard.need } : null,
    logArr: (S.logArr||[]).slice(-9),
    players: S.players.map(p => ({
      id: p.id, name: p.name, ai: p.ai, alive: p.alive, declared: p.declared, declareTurn: p.declareTurn,
      hand: p.id === viewerPid ? p.hand.map(x => cardOf(x).id) : p.hand.map(() => 0),
      handN: p.hand.length, counters: p.counters,
      slots: p.slots.map(s => ({ inst: s.inst ? cardOf(s.inst).id : null, faceUp: s.faceUp, locked: s.locked, bonus: s.bonus||0 })),
      skip: p.skip, fv: zoneFv(p)
    }))
  };
  return pub;
}
// 客户端发来的实例 id 可能是快照重建的 "id#c"，映射回真实实例（同 cid 逐个消费）
function normInsts(p, arr) {
  const out = []; const pool = p.hand.slice();
  for (const x of (arr||[])) {
    if (pool.includes(x)) { out.push(x); pool.splice(pool.indexOf(x), 1); }
    else if (typeof x === 'string' && /#/.test(x)) {
      const n = Number(String(x).split('#')[0]);
      const k = pool.findIndex(h => cid(h) === n);
      if (k > -1) { out.push(pool[k]); pool.splice(k, 1); }
    }
  }
  return out;
}
// ============ 房主：远程操作裁决 ============
function applyAct(from, a, v) {
  if (!S || S.winner) return;
  const p = P(from); if (!p || p.ai) return;
  if (S.pendingDiscard && a !== 'discard') return; // 等弃牌时只接受 discard
  switch (a) {
    case 'draw': if (S.phase==='draw' && cur().id===from && !S.resolve) doDraw(from); break;
    case 'endTurn': if (S.phase==='action' && cur().id===from && !S.resolve) endTurn(from); break;
    case 'play': {
      if (S.phase!=='action' || cur().id!==from || S.resolve) break;
      const inst = normInsts(p, [v.inst])[0];
      if (!inst) break;
      const card = cardOf(inst);
      if (card.type==='加帕里馒头') break;
      if (p.flags.mark.lockHand5 && p.hand.length >= 5) break;
      if (p.flags.restrict.noInstant && card.type==='角色牌') break;
      if (S.actionUsed && !p.extraPlay) break;
      if (p.extraPlay > 0) p.extraPlay--; else S.actionUsed = true;
      if (card.type==='事件牌') S.eventUsed = true;
      playCard(from, inst);
      break;
    }
case 'bun': {
const cutting = !!S.resolve;
if (!cutting && cur().id!==from) break;
if (cutting && (S.resolve.claimed || S.resolve.bunUsed >= 3)) break;
const inst = normInsts(p, [v.inst])[0];
if (!inst) break;
if (!cutting && (S.phase!=='action' || S.actionUsed)) break;
if (!cutting && p.flags.mark.lockHand5 && p.hand.length >= 5) break;
if (!cutting) { if (p.extraPlay > 0) p.extraPlay--; else S.actionUsed = true; }
playBun(from, inst);
break;
    }
    case 'place': {
      if (S.phase!=='action' || cur().id!==from || S.resolve) break;
      const inst = normInsts(p, [v.inst])[0];
      if (!inst) break;
      if (!isSoloCard(cardOf(inst))) break;
      if (cardOf(inst).type==='角色牌') S.actionUsed = true;
      place(from, inst, v.slot, true);
      break;
    }
    case 'counter': {
      const r = S.resolve; if (!r || r.kind==='event' || r.kind==='bun' || r.claimed) break;
      if (r.chain.some(ch=>ch.kind==='bun')) { netSend({ t:'gto', to: from, d:{ k:'evt', e:'toast', text:'连锁已被馒头截断，无法再反击', g:'err' } }); break; }
      const inst = normInsts(p, [v.inst])[0];
      if (!inst) break;
      const card = cardOf(inst);
      if (!card.counter) break;
      const lastCnt = (r.chain.length && r.chain[r.chain.length-1].kind==='counter') ? r.chain[r.chain.length-1] : null;
      if (lastCnt && lastCnt.by === from) { netSend({ t:'gto', to: from, d:{ k:'evt', e:'toast', text:'不能反击自己的反击', g:'err' } }); break; }
      if (!lastCnt && r.initiator === from) break;
      const tcardC = cardOf(lastCnt ? lastCnt.card : r.card);
      if (!counterFits(card, tcardC)) { netSend({ t:'gto', to: from, d:{ k:'evt', e:'toast', text:'属性不符：「'+card.name+'」无法反制「'+tcardC.name+'」的效果', g:'err' } }); log('🛡 '+p.name+' 想用「'+card.name+'」反击，但属性不符（'+card.counter+'），已拒绝'); break; }
      if (p.counters >= 2) break;
      rmHand(p, inst); p.counters++;
      r.chain.push({card:inst, by:from, kind:'counter'});
      toast(p.name+' 发动反击「'+card.name+'」！', 'err');
      log('🛡 '+p.name+' 反击「'+card.name+'」'+(lastCnt?'（连锁反击「'+tcardC.name+'」）':''), true);
      showCounterFX(card, p.name);
      runCounterText(from, inst, lastCnt ? lastCnt.by : r.initiator);
      aiReactToCounter();
      if (S.resolve && !S.resolve.claimed) startResolveCountdown(30);
      render(); publishState();
      break;
    }
    case 'claim': {
      const r = S.resolve; if (!r || r.claimed) break;
      if (r.initiator === from) break;
      if (cardOf(r.card).type !== '角色牌') break;
      const ids = normInsts(p, v.ids);
      if (!ids.length) break;
      if (usable(p) < ids.length + 1) break;
      doClaim(from, ids);
      break;
    }
    case 'settle': {
      const r = S.resolve; if (!r || r.claimed) break;
      startEffect();
      break;
    }
    case 'declare': {
      if (p.declared || cur().id!==from) break;
      if (zoneFv(p) < S.threshold) break;
      p.declared = true; p.declareTurn = S.turns;
      toast('🌟 '+p.name+' 宣告「交够了朋友」！','gold');
      log('🌟 '+p.name+' 宣告亮眼', true);
      render(); publishState();
      break;
    }
    case 'discard': {
      if (!S.pendingDiscard || S.pendingDiscard.pid !== from) break;
      const ids = normInsts(p, v.ids);
      if (ids.length !== S.pendingDiscard.need) break;
      ids.forEach(inst => { rmHand(p, inst); S.discard.push(inst); });
      log(p.name+' 弃置了 '+ids.length+' 张手牌');
      S.pendingDiscard = null;
      finishTurn(from);
      break;
    }
    case 'fx': {
      if (fxAskTo && fxAskTo.pid === from) applyFxAnswer(v);
      break;
    }
  }
}

function applySnap(s) {
  if (HOST) return;
  if (!s) return;
  myId = NET.pid;
  if (!S || S.players.length !== s.players.length) {
    S = {
      players: s.players.map(p => ({ id: p.id, name: p.name, ai: p.ai, alive: true, declared: false, declareTurn: -1, hand: [], counters: 0, slots: mkSlots(), skip:0, extraPlay:0, pendDiscard:0, poison:null, flags:{restrict:{},protect:{},mark:{}}, track:{attrs:[],instant:false} })),
      order: s.order.slice(), turnIdx: 0, phase: 'draw', deck: [], discard: [], actionUsed: false, eventUsed: false,
      resolve: null, threshold: s.threshold, turns: 0, winner: null,
      roundNo: 0, gflags: {}, tableStack: [], tableBuns: [], aside: [], partner: null, counterDrawUsed: false, logArr: []
    };
    S.players.forEach((p,i) => { p.slots = s.players[i].slots.map(x => ({inst: null, faceUp: x.faceUp, locked: x.locked})); });
    document.getElementById('menu').style.display = 'none';
    document.getElementById('game').style.display = 'block';
  }
  S.threshold = s.threshold; S.order = s.order.slice(); S.turnIdx = s.turnIdx; S.phase = s.phase;
  S.deck = Array(s.deckN).fill(0);
  S.discard = s.discard.slice();
  S.actionUsed = s.actionUsed; S.eventUsed = s.eventUsed;
  S.resolve = s.resolve ? { kind: s.resolve.kind, card: s.resolve.card + '#c', initiator: s.resolve.initiator, chain: (s.resolve.chain||[]).map(ch=>({card: ch.card + '#c', by: ch.by, kind: ch.kind})), bunUsed: s.resolve.bunUsed, claimed: s.resolve.claimed } : null;
  S.turns = s.turns; S.winner = s.winner ? s.winner.id : null;
  S.roundNo = s.roundNo; S.tableBuns = s.tableBuns.slice();
  S.partner = s.partner;
  S.pendingDiscard = s.pendingDiscard ? { need: s.pendingDiscard.need, pid: myId } : null;
  S.logArr = (s.logArr||[]).slice();
  // 玩家字段
  s.players.forEach((sp, i) => {
    const p = S.players.find(x => x.id === sp.id) || S.players[i];
    p.name = sp.name; p.ai = sp.ai; p.alive = sp.alive; p.declared = sp.declared; p.declareTurn = sp.declareTurn;
    p.hand = sp.hand.map(x => x === 0 ? 'bk#i' : x + '#c');
    p.counters = sp.counters; p.skip = sp.skip;
    p.slots = sp.slots.map(x => ({ inst: x.inst != null ? x.inst + '#c' : null, faceUp: x.faceUp, locked: x.locked, bonus: x.bonus||0 }));
  });
  // 日志框同步
  const lb = document.getElementById('logbox');
  lb.innerHTML = '';
  (S.logArr||[]).forEach(l => { const d = document.createElement('div'); if (l.hl) d.className='hl'; d.textContent = l.text; lb.appendChild(d); });
  // 本地倒计时刷UI
  if (s.rzLeft > 0 && !rzLocal) {
    rzLocal = setInterval(() => { if (!S.resolve) { clearInterval(rzLocal); rzLocal = null; updateRzTimer(0); return; } }, 1000);
  }
  updateRzTimer(s.rzLeft);
  // 询问中的效果若已被处理，关闭本地弹窗
  if (fxAskStep && !s.rzLeft && !S.resolve) endClientFx();
  // 弃牌模式恢复
  if (S.pendingDiscard && mode !== 'discard-limit') { mode = 'discard-limit'; bondSel = []; }
  if (!S.pendingDiscard && mode === 'discard-limit') { mode = null; bondSel = []; }
  // 快照重建手牌后，清理已失效的选中项
  if ((mode === 'discard-limit' || mode === 'bond-hand' || mode === 'fx-hand') && P(myId)) bondSel = bondSel.filter(x => P(myId).hand.includes(x));
  render();
  if (S.winner) {
    const w = S.players.find(p => p.id === S.winner);
    const ov = document.getElementById('winOverlay');
    if (w && ov && !ov.classList.contains('show')) {
      ov.innerHTML = '<div class="win-emoji">🏆</div><div class="win-name">'+w.name+'</div><div class="win-sub">交够了朋友，获得胜利！</div><button class="win-btn" onclick="location.reload()">返回大厅 · 再开一局</button>'
        + Array.from({length:30},(_,i)=>'<div class="confetti" style="left:'+(i*13%100)+'%;animation-delay:'+(i%8)*0.25+'s;animation-duration:'+(2+i%3)+'s">'+['🎉','🎊','✨','🐾','🌟'][i%5]+'</div>').join('');

    }

  if (confirm('确定离开？离开后当前对局将丢失（房主离开会导致对局终止）')) { NET.quiet = true; location.reload(); }
};
