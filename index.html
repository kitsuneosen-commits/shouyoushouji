<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加帕里公园：朋友收集（联机版）</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #000; color: #fff; width: 100%; height: 100%; overflow: hidden; user-select: none; }
/* ===== 16:9 固定舞台（所有设备呈现完整相同画面） ===== */
#stage { position: fixed; inset: 0; width: 100%; height: 100%; --slot-w: clamp(52px, 4.9vw, 110px); --slot-h: calc(var(--slot-w) * 1.46); --hc-w: clamp(88px, 9.6vw, 200px); --hc-h: calc(var(--hc-w) * 1.406); --pile-w: clamp(66px, 6.2vw, 130px); --pile-h: calc(var(--pile-w) * 1.413); --hand-h: calc(var(--hc-h) + 36px); background: linear-gradient(180deg, #0f172a 0%, #042f2e 50%, #022c22 100%); overflow: hidden; }
/* ===== 背景伪动态粒子 ===== */
#bgfx { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg-p { position: absolute; bottom: -24px; border-radius: 50%; pointer-events: none; will-change: transform, opacity; animation: bgfloat linear infinite; }
@keyframes bgfloat { 0% { transform: translate(0,0); opacity: 0; } 12% { opacity: var(--o,.5); } 85% { opacity: var(--o,.5); } 100% { transform: translate(var(--dx,30px), -770px); opacity: 0; } }
/* ===== 大厅 ===== */
#menu { height: 100%; display: flex; align-items: center; justify-content: center; }
.menu-box { text-align: center; max-width: 460px; width: 90%; }
.menu-logo { font-size: 64px; margin-bottom: 8px; }
.menu-title { font-size: 38px; font-weight: 900; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
.menu-sub { color: #fbbf24; font-weight: 800; font-size: 20px; margin: 4px 0 24px; }
.menu-card { background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 24px; backdrop-filter: blur(8px); }
.menu-card label { display: block; color: rgba(255,255,255,.7); font-size: 13px; margin-bottom: 8px; text-align: left; }
.menu-card input { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; font-size: 16px; outline: none; }
.menu-card input:focus { border-color: #fbbf24; }
.ai-row { display: flex; gap: 8px; margin: 14px 0; }
.ai-btn { flex: 1; padding: 10px 0; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: .15s; }
.ai-btn.on { background: linear-gradient(90deg,#f59e0b,#f97316); border-color: #fbbf24; box-shadow: 0 0 16px rgba(251,191,36,.4); }
.start-btn { width: 100%; padding: 14px 0; border: none; border-radius: 12px; background: linear-gradient(90deg,#f59e0b,#ea580c); color: #fff; font-size: 19px; font-weight: 900; cursor: pointer; transition: .15s; box-shadow: 0 6px 20px rgba(234,88,12,.4); }
.start-btn:hover { transform: scale(1.02); }
.start-btn:active { transform: scale(.97); }
.menu-tip { color: rgba(255,255,255,.4); font-size: 12px; margin-top: 16px; line-height: 1.7; }
/* 舞台内层级：内容浮在粒子之上 */
#menu .menu-box, #game .topbar, #game .table-area { position: relative; z-index: 1; }
#game .hand-zone, #game #logbox, #game #toasts, #game #fxpanel { z-index: 1; }
/* ===== 聊天 ===== */
.chat-log { flex: 1; overflow-y: auto; font-size: 12px; line-height: 1.8; color: rgba(255,255,255,.85); padding: 8px; }
.chat-msg { word-break: break-all; text-shadow: 0 1px 3px #000; }
.chat-msg.me { color: #fde047; }
.chat-msg.sys { color: #7dd3fc; }
.chat-row { display: flex; gap: 6px; padding: 8px; }
.chat-row input { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; font-size: 13px; outline: none; }
.chat-row input:focus { border-color: #fbbf24; }
.chat-row button { padding: 0 14px; border: none; border-radius: 8px; background: linear-gradient(90deg,#f59e0b,#ea580c); color: #fff; font-weight: 800; cursor: pointer; }
/* ===== 等待大厅（独立场景） ===== */
#waitRoom { display: none; height: 100%; }
#waitRoom.show { display: flex; align-items: center; justify-content: center; }
.wr-box { width: min(920px, 94%); background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 22px; backdrop-filter: blur(8px); }
.wr-title { font-size: 30px; font-weight: 900; text-align: center; }
.wr-room { margin: 10px 0 16px; text-align: center; font-size: 15px; color: #fde047; font-weight: 800; }
.wr-room b { font-size: 26px; letter-spacing: 6px; margin-left: 8px; }
.wr-cols { display: flex; gap: 16px; }
.wr-left { width: 300px; flex-shrink: 0; }
.wr-right { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 340px; background: rgba(2,6,23,.6); border: 1px solid rgba(251,191,36,.3); border-radius: 14px; }
.wr-sub { font-size: 13px; font-weight: 800; color: #fbbf24; margin-bottom: 8px; }
.wr-members { min-height: 120px; max-height: 180px; overflow-y: auto; font-size: 14px; }
.wr-members div { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 10px; background: rgba(255,255,255,.05); margin-bottom: 6px; }
.ml-host { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: #f59e0b; color: #1e293b; font-weight: 900; margin-left: 6px; }
.ml-off { color: #f87171; font-size: 11px; }
#waitRoom .start-btn { margin-top: 10px; }
/* 对局内右侧聊天 */
#chatBox { position: fixed; right: 10px; bottom: 8px; width: 198px; height: 230px; z-index: 41; display: flex; flex-direction: column; background: rgba(2,6,23,.86); border: 1px solid rgba(251,191,36,.32); border-radius: 14px; backdrop-filter: blur(5px); }
#chatBox .chat-log { padding: 6px; }
#chatBox .chat-row { padding: 6px; }

/* ===== 桌面 ===== */
#game { display: none; height: 100%; box-sizing: border-box; }
.topbar { position: sticky; top: 0; z-index: 40; background: rgba(0,0,0,.55); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,255,255,.1); padding: 4px 16px; display: flex; align-items: center; gap: 16px; font-size: 13px; }
.topbar b { color: #fbbf24; }
.topbar .sp { flex: 1; }
.topbar button { background: none; border: none; color: rgba(255,255,255,.6); cursor: pointer; font-size: 12px; text-decoration: underline; }
.table-area { max-width: none; margin: 0; padding: 4px 14px calc(var(--hand-h) + 44px); min-height: calc(100% - 40px); display: flex; flex-direction: column; box-sizing: border-box; }

/* 对手卡 */
.opponents { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 10px; }
.opp { position: relative; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.25); padding: 4px 10px; transition: .3s; }
.opp.cur { border-color: rgba(251,191,36,.8); animation: turnpulse 1.8s infinite; }
.opp.dead { filter: grayscale(1) brightness(.5); }
.opp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.opp-head .nm { font-weight: 800; font-size: 14px; }
.opp-head .fv { margin-left: auto; color: #fde047; font-weight: 900; font-size: 15px; }
.tag-ai { font-size: 10px; padding: 1px 6px; border-radius: 99px; background: #6366f1; font-weight: 800; }
.tag-declare { font-size: 10px; padding: 1px 6px; border-radius: 99px; background: #facc15; color: #1e293b; font-weight: 900; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .4; } }
.slots { display: grid; grid-template-columns: repeat(7, var(--slot-w)); justify-content: center; gap: clamp(3px, 0.4vw, 6px); }
.slot { height: var(--slot-h); border-radius: 7px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); overflow: hidden; cursor: pointer; position: relative; }
.slot img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.slot.locked { border-color: rgba(239,68,68,.6); background: rgba(127,29,29,.3); }
.slot.locked::after { content: '🔒'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.slot.sel { border-color: #fbbf24; background: rgba(251,191,36,.2); animation: blink 1s infinite; }
.me-panel .slot { height: var(--slot-h); border-radius: 8px; }
.opp.sel-tgt { border-color: #fbbf24; box-shadow: 0 0 18px rgba(251,191,36,.55); animation: turnpulse 1.4s infinite; }
.opp-foot { display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; color: rgba(255,255,255,.55); }

/* 中央区 */
.center { display: flex; align-items: center; justify-content: center; gap: 30px; margin: 4px 0; flex: 1; }
.pile { text-align: center; }
.pile-box { width: var(--pile-w); height: var(--pile-h); position: relative; }
.pile-box .cb { position: absolute; inset: 0; border-radius: 10px; border: 2px solid rgba(251,191,36,.4); background: #0b1220 center/cover; }
.pile-n { font-size: 11px; color: rgba(255,255,255,.6); margin-top: 6px; }
.resolve-zone { flex: 1; max-width: min(40vw, 560px); min-height: clamp(110px, 17vh, 170px); border-radius: 14px; border: 1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.3); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; position: relative; animation: tablepulse 5s infinite; }
.rz-title { position: absolute; top: 8px; left: 12px; font-size: 11px; color: #fbbf24; font-weight: 800; }
.rz-timer { position: absolute; top: 8px; right: 12px; font-size: 11px; color: rgba(255,255,255,.65); }
.rz-card { width: calc(var(--pile-w) + 4px); height: calc(var(--pile-h) + 4px); animation: floatcard 3s infinite; }
.rz-card img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 10px; border: 3px solid rgba(255,255,255,.5); box-shadow: 0 8px 30px rgba(0,0,0,.6); }
.rz-info { font-size: 12px; color: rgba(255,255,255,.75); margin-top: 8px; text-align: center; line-height: 1.6; }
.rz-chain { color: #7dd3fc; font-size: 11px; }
@keyframes floatcard { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes tablepulse { 0%,100% { box-shadow: inset 0 0 60px 10px rgba(13,148,136,.12); } 50% { box-shadow: inset 0 0 90px 26px rgba(20,184,166,.25); } }
@keyframes turnpulse { 0%,100% { box-shadow: 0 0 0 2px rgba(251,191,36,.35), 0 0 14px rgba(251,191,36,.2); } 50% { box-shadow: 0 0 0 3px rgba(251,191,36,.85), 0 0 26px rgba(251,191,36,.5); } }

/* 我的状态 */
.me-panel { border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: rgba(0,0,0,.25); padding: 6px 12px; margin-bottom: 0; }
.me-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.me-head .nm { font-weight: 800; }
.me-head .fv { margin-left: auto; color: #fde047; font-weight: 900; font-size: 18px; }
.my-turn { font-size: 10px; padding: 2px 8px; border-radius: 99px; background: #34d399; color: #064e3b; font-weight: 900; }
.declare-btn { margin-left: 10px; padding: 4px 12px; border: none; border-radius: 8px; background: linear-gradient(90deg,#facc15,#f59e0b); color: #1e293b; font-weight: 900; font-size: 12px; cursor: pointer; animation: blink 1.4s infinite; }

/* 手牌 */
.hand-zone { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: linear-gradient(0deg, rgba(0,0,0,.9) 20%, transparent); padding: 20px 12px 8px; }
.hand-row { display: flex; justify-content: center; align-items: flex-end; gap: 4px; height: calc(var(--hc-h) + 26px); perspective: 1200px; }
.hcard { width: var(--hc-w); height: var(--hc-h); position: relative; transform-origin: bottom center; transition: transform .3s cubic-bezier(.22,.9,.32,1.05); }
.hcard:hover { transform: translateY(-46px) scale(1.12) !important; z-index: 50; }
.hcard-inner { width: 100%; height: 100%; border-radius: 9px; overflow: hidden; position: relative; border: 2px solid rgba(255,255,255,.35); box-shadow: 0 6px 18px rgba(0,0,0,.5); cursor: pointer; }
.hcard-inner img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.hcard-inner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.3) 50%, transparent 58%); transform: translateX(-160%); animation: shine 4.5s infinite; }
@keyframes shine { 0%,60% { transform: translateX(-160%); } 100% { transform: translateX(160%); } }
.hcard.sel .hcard-inner { border-color: #fde047; box-shadow: 0 0 0 3px rgba(251,191,36,.7), 0 10px 30px rgba(251,191,36,.4); }
.hcard.bondcand .hcard-inner { border-color: #e879f9; }
.hcard.cntcand .hcard-inner { border-color: #ff4d4d; animation: redpulse 2.4s ease-in-out infinite; }
@keyframes redpulse {
  0%,100% { box-shadow: 0 0 6px 2px rgba(255,60,60,.4); }
  50%      { box-shadow: 0 0 12px 4px rgba(255,80,80,.7); }
}
.hcard.bondglow .hcard-inner { border-color: #4ade80; animation: greenpulse 2.6s ease-in-out infinite; }
@keyframes greenpulse {
  0%,100% { box-shadow: 0 0 6px 2px rgba(60,220,110,.4); }
  50%      { box-shadow: 0 0 12px 4px rgba(60,240,120,.65); }
}
.hcard .top-info { position: absolute; top: 3px; left: 3px; right: 3px; display: flex; justify-content: space-between; z-index: 2; font-size: 10px; }
.hcard .type-tag { padding: 1px 6px; border-radius: 99px; font-weight: 800; background: rgba(0,0,0,.55); }
.hcard .type-tag.bun { background: #ec4899; }
.hcard .type-tag.evt { background: #8b5cf6; }
.hcard .bot-info { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(0deg, rgba(0,0,0,.85), transparent); padding: 10px 4px 3px; z-index: 2; font-size: 10px; }
.hcard .fv { color: #fde047; font-weight: 900; float: left; }
.hcard .lv { color: #6ee7b7; font-weight: 700; float: right; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; min-height: 36px; }
.gbtn { padding: 10px 20px; border: none; border-radius: 11px; font-size: 15px; font-weight: 800; cursor: pointer; transition: .12s; color: #fff; }
.gbtn:active { transform: scale(.94); }
.gbtn:disabled { opacity: .35; cursor: not-allowed; }
.gbtn.draw { background: linear-gradient(90deg,#14b8a6,#06b6d4); }
.gbtn.play { background: linear-gradient(90deg,#f59e0b,#ea580c); }
.gbtn.bun { background: linear-gradient(90deg,#ec4899,#e11d48); }
.gbtn.place { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); }
.gbtn.end { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); }
.gbtn.counter { background: linear-gradient(90deg,#ef4444,#dc2626); }
.gbtn.bond { background: linear-gradient(90deg,#d946ef,#a21caf); }
.gbtn.settle { background: linear-gradient(90deg,#f59e0b,#ea580c); }
.gbtn.fx { background: #475569; }

/* 左侧信息栏 */
#sideInfo { position: fixed; left: 12px; top: 76px; width: 300px; max-height: 420px; overflow-y: auto; z-index: 200; background: rgba(2,6,23,.94); border: 1px solid rgba(251,191,36,.4); border-radius: 14px; padding: 14px; display: none; box-shadow: 0 14px 50px rgba(0,0,0,.6); }
#sideInfo.show { display: block; animation: fadein .2s; }
#sideInfo .si-img { width: 100%; height: 250px; border-radius: 10px; overflow: hidden; border: 3px solid rgba(251,191,36,.5); }
#sideInfo .si-img img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
#sideInfo h3 { font-size: 20px; margin: 10px 0 6px; }
.si-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.si-tags span { font-size: 10px; padding: 2px 9px; border-radius: 99px; background: rgba(255,255,255,.1); }
.si-tags .fv { background: rgba(250,204,21,.2); color: #fde047; font-weight: 800; }
.si-tags .lv { background: rgba(16,185,129,.2); color: #6ee7b7; font-weight: 800; }
.si-sec { margin-bottom: 9px; }
.si-sec .t { font-size: 10px; color: rgba(255,255,255,.5); margin-bottom: 3px; }
.si-sec .v { font-size: 12.5px; line-height: 1.6; background: rgba(255,255,255,.05); border-radius: 8px; padding: 8px 10px; }
.si-sec.counter .v { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25); }
@keyframes fadein { from { opacity: 0; } }
/* 弃牌区查看 */
#discardView { position: fixed; inset: 0; z-index: 95; background: rgba(0,0,0,.8); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; }
#discardView.show { display: flex; animation: fadein .2s; }
.dv-box { width: min(880px, 92%); max-height: 605px; overflow-y: auto; background: rgba(15,23,42,.96); border: 1px solid rgba(255,255,255,.15); border-radius: 16px; padding: 18px; }
.dv-title { font-size: 16px; font-weight: 900; margin-bottom: 12px; color: #fbbf24; }
#bigModal { position: fixed; inset: 0; z-index: 96; background: rgba(0,0,0,.8); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; }
#bigModal.show { display: flex; animation: fadein .2s; }
.dlg { display: flex; flex-wrap: wrap; justify-content: center; text-align: center; color: #fff; flex-direction: column; align-items: center; }
.dlg-close { margin-top: 12px; padding: 8px 22px; border: none; border-radius: 8px; background: #475569; color: #fff; font-weight: 700; cursor: pointer; }
.dlg-close:hover { background: #64748b; }
.dv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.dv-grid img { width: 100%; aspect-ratio: 3/4.2; object-fit: cover; object-position: top; border-radius: 8px; border: 2px solid rgba(255,255,255,.25); cursor: pointer; transition: .15s; }
.dv-grid img:hover { transform: scale(1.08); border-color: #fde047; }
/* 右侧玩家列表（可收纳） */
#sideTab { position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 42; writing-mode: vertical-rl; padding: 16px 5px; border: 1px solid rgba(251,191,36,.32); border-right: none; border-radius: 10px 0 0 10px; background: rgba(2,6,23,.9); color: #fbbf24; font-weight: 800; font-size: 13px; letter-spacing: 3px; cursor: pointer; }
#plist, #chatBox { transition: transform .25s ease; }
body.side-closed #plist, body.side-closed #chatBox { transform: translateX(120%); }
#plist { position: fixed; right: 10px; top: 56px; width: 198px; z-index: 40; background: rgba(2,6,23,.86); border: 1px solid rgba(251,191,36,.32); border-radius: 14px; padding: 10px 10px 6px; backdrop-filter: blur(5px); max-height: 340px; overflow-y: auto; }
#plist .pl-title { font-size: 12px; color: #fbbf24; font-weight: 800; margin-bottom: 8px; letter-spacing: 1px; }
.pl-row { position: relative; display: flex; align-items: center; gap: 7px; padding: 7px 8px; border-radius: 10px; margin-bottom: 6px; background: rgba(255,255,255,.05); border: 1px solid transparent; overflow: hidden; }
.pl-row.cur { border-color: #fbbf24; background: rgba(251,191,36,.14); box-shadow: 0 0 14px rgba(251,191,36,.25); }
.pl-row.dead { opacity: .4; }
.pl-row.full { border-color: rgba(244,114,182,.75); background: rgba(244,114,182,.14); }
.pl-main { flex: 1; min-width: 0; }
.pl-nm { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-turn { color: #fbbf24; font-size: 10px; font-weight: 800; margin-left: 4px; }
.pl-stats { font-size: 11px; color: rgba(255,255,255,.72); margin-top: 2px; }
@keyframes heartfloat { 0% { transform: translateY(6px) scale(.5); opacity: 0; } 22% { opacity: 1; } 100% { transform: translateY(-42px) scale(1.35); opacity: 0; } }
.pl-hearts { position: absolute; right: 2px; top: 4px; bottom: 0; width: 42px; pointer-events: none; }
.pl-hearts i { position: absolute; bottom: 2px; font-style: normal; font-size: 13px; animation: heartfloat 1.7s ease-in infinite; text-shadow: 0 0 8px rgba(244,114,182,.9); }
.dv-empty { color: rgba(255,255,255,.5); font-size: 13px; }
/* 反击特效 */
.counter-overlay { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(239,68,68,.35), rgba(0,0,0,.72)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; animation: fadein .15s; }
.counter-title { font-size: 34px; font-weight: 900; color: #fca5a5; letter-spacing: .25em; text-shadow: 0 0 30px rgba(239,68,68,1); animation: countershake .6s .25s; }
.counter-big { width: 210px; height: 300px; border-radius: 16px; overflow: hidden; border: 4px solid #ef4444; box-shadow: 0 0 70px rgba(239,68,68,.7); animation: counterin .5s cubic-bezier(.2,.9,.3,1); }
.counter-big img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.counter-name { font-size: 18px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,.9); }
@keyframes counterin { 0% { transform: scale(2.2) rotate(8deg); opacity: 0; } 55% { transform: scale(.95) rotate(-2deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
@keyframes countershake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }

/* 特效层 */
#fx-layer { position: fixed; inset: 0; z-index: 90; pointer-events: none; }
.shuffle-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.65); display: flex; align-items: center; justify-content: center; }

const cid = inst => Number(String(inst).split('#')[0]);

// 反击条件匹配：严格分类——反击牌只能反制其文本声明的情况
function counterTrigger(txt) {
const t = String(txt||'').replace(/\s/g,'');
if (!t) return null;
if (/自己被反击时/.test(t)) return 'selfCountered';
if (/当自己被其他玩家效果弃牌|自己被对方效果弃牌|自己被偷取/.test(t)) return 'selfHurt';
if (/即时效果(?:发动)?(?:时)?/.test(t) && /无效|阻止/.test(t)) return 'instant';
if (/反击效果(?:发动|使用)?(?:时|是)/.test(t) && /无效|阻止/.test(t)) return 'counter';
if (/抽(?:出)?3张以上|抽3张以上/.test(t)) return 'draw3';
if (/抽牌效果/.test(t)) return 'draw';
if (/从弃牌区取牌|从弃牌区.*?(加入手牌|抽取|抽\d+张)/.test(t)) return 'discardPick';
if (/偷取.*?手牌/.test(t) && /阻止|无效|出现|效果/.test(t)) return 'steal';
if (/弃牌效果/.test(t)) return 'discard';
if (/任意效果发动|当任意效果/.test(t)) return 'any';
return null;
}
function effectKindOf(tc) {
if (!tc) return '';
const eff = String(tc.effect||'').replace(/\s/g,'');
if (/偷取/.test(eff)) return 'steal';
if (/弃牌区/.test(eff) && /加入手牌|抽(?:出|取)?/.test(eff)) return 'discardPick';
if (/从牌堆抽|抽(?:出)?\d+张/.test(eff)) return 'draw';
if (/丢(?:弃)?/.test(eff) && /张/.test(eff)) return 'discard';
return 'instant';
}
function drawNOf(tc) {
const eff = String((tc&&tc.effect)||'').replace(/\s/g,'');
let n = 0, m; const re = /抽(?:出)?(\d+)张/g;
while ((m = re.exec(eff))) n = Math.max(n, +m[1]);
return n;
}
function counterFits(cc, tc, chainCnt) {
  if (!cc || !cc.counter) return false;
  const txt = String(cc.counter).replace(/\s/g,'');
  const tAttr = (tc && tc.attr) || '', tRace = (tc && tc.race) || '';
  // 属性·种族组合，如「雪域·兽族效果发动时」
  const m2 = txt.match(/(雪域|沙漠|林原|海洋)·(兽族|鸟族)效果发动/);
  if (m2) return tAttr === m2[1] && tRace.startsWith(m2[2].charAt(0));
  // 属性限制，如「沙漠属性角色效果发动时」
  const m1 = txt.match(/(雪域|沙漠|林原|海洋)((?:或|、)(?:雪域|沙漠|林原|海洋))*(?:属性)?角色牌?效果(?:发动)?时?/);
  if (m1) return m1[0].split(/(?:属性)?角色牌?效果(?:发动)?时?/)[0].split(/或|、/).indexOf(tAttr) > -1;
  // 种族限制，如「兽族角色牌效果发动时」
  const m3 = txt.match(/(兽族|鸟族)角色牌?效果发动/);
  if (m3) return tRace.startsWith(m3[1].charAt(0));
  const trig = counterTrigger(txt);
  if (!trig) return false;
  if (trig === 'selfHurt' || trig === 'selfCountered') return false; // 被动时点型：不能主动打出反击，由事件触发
  if (trig === 'counter') return !!chainCnt;
  if (trig === 'any' || trig === 'instant') return true;
  const ek = effectKindOf(tc);
  if (trig === 'draw') return ek === 'draw';
  if (trig === 'draw3') return ek === 'draw' && drawNOf(tc) >= 3;
  if (trig === 'discardPick') return ek === 'discardPick';
  if (trig === 'steal') return ek === 'steal';
  if (trig === 'discard') return ek === 'discard';
  return false;
}

// 当自己被其他玩家效果弃牌/偷取时 → 触发手牌中的被动反击（含无效化判定）
// action = 待执行的弃牌/偷取动作；被动带「那个效果无效」时不执行 action
function triggerSelfHurt(victimId, actorId, kind, action) {
  if (!S || victimId === actorId) { if (action) action(); return false; }
  const v = P(victimId); if (!v || !v.alive) { if (action) action(); return false; }
  const idx = v.hand.findIndex(inst => {
    const cc = cardOf(inst); if (!cc.counter) return false;
    const t = String(cc.counter).replace(/\s/g,'');
    if (/只有自己被选做效果对象/.test(t)) return true;
    if (counterTrigger(cc.counter) !== 'selfHurt') return false;
    const d = /弃牌/.test(t), s = /偷取/.test(t);
    return kind === 'discard' ? d : s;
  });
  if (idx < 0) { if (action) action(); return false; }
  const inst = v.hand[idx]; const cc = cardOf(inst);
  const txt = String(cc.counter).replace(/\s/g,'');
  rmHand(v, inst);
  const neg = /那个效果无效/.test(txt);
  const place2x = /将这张牌友情值\*2/.test(txt);
  if (!place2x) S.discard.push(inst);
  toast('🛡 ' + v.name + ' 的「' + cc.name + '」被动反击触发！', 'err');
  log('🛡 被动时点：' + v.name + '「' + cc.name + '」被' + (kind==='discard'?'弃牌':'偷取') + '时触发' + (neg?'（原效果无效）':''), true);
  showCounterFX(cc, v.name);
  runPassiveCounter(victimId, inst, cc, actorId, place2x);
  if (!neg && action) action();
  render();
  return true;
}

// AI 找最优羁绊组合（打出牌+若干手牌同属一个羁绊，总数≥2）
function bestBondCombo(ai, played) {
  let best = null;
  for (const b of (played.bonds||[])) {
    const cands = ai.hand.filter(h => (cardOf(h).bonds||[]).includes(b));
    for (let k = cands.length; k >= 1; k--) {
      const combo = cands.slice(0, k);
      if (usable(ai) < combo.length + 1) continue;
      const fv = combo.reduce((s,h)=>s+(cardOf(h).fv||0),0) + (played.fv||0);
      if (!best || fv > best.fv) best = { bond: b, handIds: combo, fv };
      break; // 该羁绊下最多张
    }
  }
  return best;
}

function aiResolveStep(st) {
  const ctx = PFX.ctx;
  const type = st[0], arg = st[1];
  const others = S.players.filter(p=>p.alive && p.id!==ctx.actor);
  const pickFrom = (filter) => {
    let cands = others.filter(p => !filter || filter(p.id));
    if (!cands.length) cands = others;
    if (!cands.length) cands = [P(ctx.actor)];
    // AI 优先打人类，其次随机
    const hum = cands.find(p=>!p.ai);
    const pick = hum || cands[Math.floor(Math.random()*cands.length)];
    return pick ? pick.id : ctx.actor;
  };
  if (type==='t') ctx.t = pickFrom(arg);
  else if (type==='t2') { let ex = ctx.t; ctx.t2 = pickFrom(pid=>pid!==ex); }
  else if (type==='h') { const n = Math.min(arg, P(ctx.actor).hand.length); ctx.h = P(ctx.actor).hand.slice(0,n); }
  else if (type==='hv') { const t=P(ctx.t); const n=Math.min(arg||1, t?t.hand.length:0); ctx.hv = t ? t.hand.slice(0,n) : []; }
  else if (type==='coin') ctx.coin = Math.random()<0.5;
  else if (type==='rps') ctx.rps = Math.random()<0.5;
  else if (type==='ar') ctx.ar = { a: ATTRS[Math.floor(Math.random()*4)], r: RACES[Math.floor(Math.random()*3)] };
  else if (type==='a') ctx.attr = ATTRS[Math.floor(Math.random()*4)];
  else if (type==='deckpick') { ctx.picked = S.deck[S.deck.length-1]; }
  else if (type==='guessHand') ctx.guess = { inst: P(ctx.t)?P(ctx.t).hand[0]:null, a: ATTRS[Math.floor(Math.random()*4)], r: RACES[Math.floor(Math.random()*3)] };

}

// ============ 效果 API 原语 ============
// 卡组固定316张（每种2张），抽尽后不再重洗
function drawCards(pid, n) {
const p = P(pid); let got = 0;
for (let i=0;i<n;i++) {
const inst = S.deck.pop(); if (!inst) break;
p.hand.push(inst); got++;
}
if (got && !S.deck.length && !S._deckEmptyNoted) { S._deckEmptyNoted = true; if (!NET.on || HOST) toast('📦 牌堆已抽尽，不再补充','err'); log('📦 牌堆耗尽（本局卡组316张，抽完不重洗）', true); }
  if (got) { log(p.name+' 抽了 '+got+' 张牌'); if (pid===myId) flyCard('me', ()=>{}); }
  render();
}
function randomSplice(arr) { return arr.length ? arr.splice(Math.floor(Math.random()*arr.length),1)[0] : null; }
function discardFrom(pid, n) {
  const p = P(pid); let done = 0;
  for (let i=0;i<n && p.hand.length;i++) { S.discard.push(randomSplice(p.hand)); done++; }
  if (done) log(p.name+' 被弃置 '+done+' 张手牌');
  render();
}
function makeAPI(actorId, ctx) {
  const ID = x => (x && typeof x==='object' && typeof x.id==='string') ? x.id : x;
  const A = {
    // 基础
    players: () => S.players.filter(p=>p.alive),
    allPlayers: fn => S.players.filter(p=>p.alive).forEach(fn),
    allOthers: (pid, fn) => S.players.filter(p=>p.alive&&p.id!==pid).forEach(fn),
    randomPlayer: f => { const c=S.players.filter(p=>p.alive&&(!f||f(p.id))); return c.length?c[Math.floor(Math.random()*c.length)].id:null; },
    nextPlayer: pid => { const i=S.order.indexOf(pid); for(let k=1;k<=S.order.length;k++){const q=P(S.order[(i+k)%S.order.length]); if(q.alive&&q.id!==pid) return q.id;} return pid; },
    handCount: pid => P(pid).hand.length,
    zoneCount: pid => P(pid).slots.filter(s=>s.inst).length,
    zoneAttrCount: (pid,attr) => P(pid).slots.filter(s=>s.inst&&cardOf(s.inst).attr===attr).length,
    track: (pid, key) => { const t = P(ID(pid)).track; return key==='instant' ? t.instant : t.attrs; },
    note: t => { log('ℹ '+t); },
    discardedName: nm => S.discard.concat(S.tableStack).filter(i=>cardOf(i).name===nm).length,
    viewHand: pid => { const t = P(pid); if (actorId === myId) showHandModal(t, 0, false); else if (!P(actorId).ai) netSend({t:'gto', to:actorId, d:{k:'reveal', name:t.name, cards:t.hand.map(x=>cardOf(x).id)}}); log('查看了 '+t.name+' 的手牌'); },
    targetHasAttr: (pid, attr) => P(pid).hand.some(h=>cardOf(h).attr===attr) || P(pid).slots.some(s=>s.inst&&cardOf(s.inst).attr===attr),
// 抽/弃/偷/给（被动时点钩子：被其他玩家效果弃牌/偷取时触发被动反击）
draw: (pid,n) => drawCards(pid,n),
discardR: (pid,n) => triggerSelfHurt(pid, actorId, 'discard', () => discardFrom(pid,n)),
discardC: (pid,insts) => triggerSelfHurt(pid, actorId, 'discard', () => { const p=P(pid); (insts||[]).forEach(inst=>{ rmHand(p,inst); S.discard.push(inst); }); log(p.name+' 弃置了 '+(insts||[]).length+' 张手牌'); render(); }),
discardAll: pid => triggerSelfHurt(pid, actorId, 'discard', () => { const p=P(pid); p.hand.forEach(i=>S.discard.push(i)); const n=p.hand.length; p.hand=[]; log(p.name+' 弃置全部手牌（'+n+'张）'); render(); }),
    mill: n => { for(let i=0;i<n&&S.deck.length;i++) S.discard.push(S.deck.pop()); log('牌堆顶 '+n+' 张进入弃牌区'); render(); },
    fromBottom: n => { const p=P(actorId); let got=0; for(let i=0;i<n&&S.deck.length;i++){ p.hand.unshift(S.deck.shift()); got++; } log(p.name+' 从牌堆底摸了 '+got+' 张'); render(); },
    gainPicked: (pid,inst) => { if(!inst) return; const di=S.deck.indexOf(inst); if(di>-1) S.deck.splice(di,1); P(pid).hand.push(inst); log(P(pid).name+' 从牌堆顶选取了「'+cardOf(inst).name+'」加入手牌'); render(); },
    reclaim: n => { const p=P(actorId); let got=0; for(let i=0;i<n&&S.discard.length;i++){ p.hand.push(S.discard.pop()); got++; } log(p.name+' 从弃牌区回收了 '+got+' 张'); render(); },
    reclaimBonded: (pid,n) => { const p=P(pid); const cands=S.discard.filter(i=>{ const b=cardOf(i).bonds||[]; return p.slots.some(s=>s.inst&&(cardOf(s.inst).bonds||[]).some(x=>b.includes(x))); }); let got=0; for(let i=0;i<n&&cands.length;i++){ const inst=cands.splice(Math.floor(Math.random()*cands.length),1)[0]; const di=S.discard.indexOf(inst); if(di>-1){ S.discard.splice(di,1); p.hand.push(inst); got++; } } log(p.name+' 回收了 '+got+' 张同羁绊牌'); render(); },
    copyFromDiscard: pid => { const roles=S.discard.filter(i=>cardOf(i).type==='角色牌'); if(!roles.length){A.note('弃牌区没有角色牌');return;} const best=roles.sort((a,b)=>cardOf(b).fv-cardOf(a).fv)[0]; S.discard.splice(S.discard.indexOf(best),1); P(pid).hand.push(best); log('🦎 变色龙复制了「'+cardOf(best).name+'」'); render(); },
stealR: (from,to,n) => triggerSelfHurt(from, actorId, 'steal', () => { const f=P(from),t=P(to); let got=0; for(let i=0;i<n&&f.hand.length;i++){ t.hand.push(randomSplice(f.hand)); got++; } log(t.name+' 偷取了 '+f.name+' '+got+' 张手牌'); render(); }),
stealC: (from,to,insts) => triggerSelfHurt(from, actorId, 'steal', () => { const f=P(from),t=P(to); (insts||[]).filter(Boolean).forEach(inst=>{ rmHand(f,inst); t.hand.push(inst); }); log(t.name+' 偷取了 '+f.name+' '+(insts||[]).length+' 张指定手牌'); render(); }),
stealAll: (from,to) => triggerSelfHurt(from, actorId, 'steal', () => { const f=P(from),t=P(to); const n=f.hand.length; t.hand.push(...f.hand); f.hand=[]; log(t.name+' 偷取了 '+f.name+' 全部手牌（'+n+'张）'); render(); }),
    give: (from,to,inst) => { if(!inst) return; const f=P(from); rmHand(f,inst); P(to).hand.push(inst); log(f.name+' 将1张手牌交给 '+P(to).name); render(); },
    giveRandom: (from,to) => { const f=P(from); const inst=randomSplice(f.hand); if(inst){ P(to).hand.push(inst); log(f.name+' 将1张随机手牌交给 '+P(to).name); } render(); },
    swapHands: (a,b) => { const x=P(a),y=P(b); const tmp=x.hand; x.hand=y.hand; y.hand=tmp; log(x.name+' 与 '+y.name+' 手牌互换'); render(); },
    swapWithTarget: (pid,inst,tid) => { if(!inst) return; const p=P(pid),t=P(tid); rmHand(p,inst); const back=randomSplice(t.hand); t.hand.push(inst); if(back) p.hand.push(back); log(p.name+' 与 '+t.name+' 交换了1张手牌'); render(); },
    // 友情区
    zoneDiscardR: pid => { const p=P(pid); let n=0; p.slots.forEach(s=>{ if(s.inst){ S.discard.push(s.inst); s.inst=null; s.fvOverride=null; n++; } }); log(p.name+' 友情区 '+n+' 张牌被丢弃'); render(); },
    zoneDiscardSelf: pid => { const p=P(pid); const idx=p.slots.findIndex(s=>s.inst); if(idx>-1){ S.discard.push(p.slots[idx].inst); p.slots[idx].inst=null; log(p.name+' 丢弃了友情区1张牌'); } render(); },
    zoneClear: pid => { const p=P(pid); let n=0; p.slots.forEach(s=>{ if(s.inst){ S.discard.push(s.inst); s.inst=null; n++; } }); log(p.name+' 友情区被清空（'+n+'张）'); render(); },
    zoneStealR: (from,to) => { const f=P(from),t=P(to); const idx=f.slots.findIndex(s=>s.inst); if(idx>-1){ const inst=f.slots[idx].inst; f.slots[idx].inst=null; const free=t.slots.findIndex(s=>!s.inst&&!s.locked); if(free>-1){ t.slots[free].inst=inst; log(t.name+' 夺走了 '+f.name+' 友情区的「'+cardOf(inst).name+'」'); } else S.discard.push(inst); } render(); },
    swapZoneR: (a,b) => { const x=P(a),y=P(b); const ix=x.slots.findIndex(s=>s.inst); const iy=y.slots.findIndex(s=>s.inst); if(ix>-1&&iy>-1){ const tmp=x.slots[ix].inst; x.slots[ix].inst=y.slots[iy].inst; y.slots[iy].inst=tmp; log(x.name+' 与 '+y.name+' 友情区1张牌互换'); } render(); },
    coverZoneR: (pid,n) => { const p=P(pid); let n2=0; for(let i=0;i<n;i++){ const gi=S.deck.pop(); if(!gi) break; const free=p.slots.findIndex(s=>!s.inst&&!s.locked); if(free<0){ S.discard.push(gi); break; } p.slots[free]={inst:gi,faceUp:false,coverTurns:2}; n2++; } log(p.name+' 友情区被盖放 '+n2+' 张牌'); render(); },
    coverHandToZone: pid => { const p=P(pid); const inst=randomSplice(p.hand); if(inst){ const free=p.slots.findIndex(s=>!s.inst&&!s.locked); if(free>-1){ p.slots[free]={inst,faceUp:false,coverTurns:2}; log(p.name+' 1张手牌被盖放在友情区'); } else p.hand.push(inst); } render(); },
    coverHandAside: (pid,n) => { const p=P(pid); for(let i=0;i<n&&p.hand.length;i++){ const inst=randomSplice(p.hand); if(inst){ p.slots.forEach(s=>{ if(s.inst===inst) s.inst=null; }); S.aside.push({pid,inst}); } } log(p.name+' 的 '+n+' 张手牌被移出游戏'); render(); },
    coverChosenToZone: (pid,inst) => { if(!inst) return; const p=P(pid); rmHand(p,inst); const free=p.slots.findIndex(s=>!s.inst&&!s.locked); if(free>-1){ p.slots[free]={inst,faceUp:false,coverTurns:2}; log(p.name+' 将1张手牌盖放在友情区'); } render(); },
    selfPlaceCovered: () => { const p=P(actorId); const free=p.slots.findIndex(s=>!s.inst&&!s.locked); if(free>-1){ p.slots[free]={inst:ctx.played,faceUp:false,coverTurns:2}; if(S.resolve) S.resolve.taken=null; log(p.name+' 将本牌盖放在自己友情区'); } render(); },
    flipAllCovered: () => { let n=0; S.players.forEach(p=>p.slots.forEach(s=>{ if(s.inst&&!s.faceUp){ s.faceUp=true; s.coverTurns=null; n++; } })); log('翻开全场所有盖放的牌（'+n+'张）'); render(); },
    clearAllCovered: () => { S.players.forEach(p=>p.slots.forEach(s=>{ if(s.inst&&!s.faceUp){ S.discard.push(s.inst); s.inst=null; } })); log('丢弃场上所有盖放的牌'); render(); },
    hasCovered: pid => P(pid).slots.some(s=>s.inst&&!s.faceUp),
    penguinReturn: () => { const n=S.discard.filter(i=>cardOf(i).name.includes('企鹅')).length; let done=0; S.players.forEach(p=>{ while(done<n){ const idx=p.slots.findIndex(s=>s.inst&&s.faceUp); if(idx<0) break; p.hand.push(p.slots[idx].inst); p.slots[idx].inst=null; done++; } }); log('🐧 企鹅回巢：'+done+' 张友情区牌回到持有者手牌'); render(); },
    zoneFillTo3: () => { S.players.forEach(p=>{ const cnt=p.slots.filter(s=>s.inst).length; for(let i=cnt;i<3;i++){ const gi=S.deck.pop(); if(!gi) break; const free=p.slots.findIndex(s=>!s.inst&&!s.locked); if(free<0) break; p.slots[free]={inst:gi,faceUp:true}; } }); log('🐧 全场友情区补足至3张'); render(); },
    setTo7: pid => { const p=P(pid); while(p.hand.length<7&&S.deck.length) p.hand.push(S.deck.pop()); while(p.hand.length>7) S.discard.push(randomSplice(p.hand)); log(p.name+' 手牌调整为7张'); render(); },
    placeFromHand: pid => { const p=P(pid); const roles=p.hand.filter(h=>cardOf(h).type==='角色牌'); if(roles.length){ const best=roles.sort((a,b)=>cardOf(b).fv-cardOf(a).fv)[0]; const free=freeSlotIdx(p); if(free>-1) place(pid,best,free,true); } },
    selfBondToZone: pid => { const p=P(pid); const played=cardOf(ctx.played); for(const b of (played.bonds||[])){ const cands=p.hand.filter(h=>(cardOf(h).bonds||[]).includes(b)); if(cands.length){ const inst=cands[0]; rmHand(p,inst); const free=freeSlotIdx(p); if(free>-1) place(pid,inst,free,true); break; } } },
    takePlayedCard: pid => { if(S.resolve){ S.resolve.taken = pid; } },
    pickDiscard1: pid => triggerSelfHurt(pid, actorId, 'discard', () => { const p=P(pid); if(p.hand.length){ const inst=randomSplice(p.hand); S.discard.push(inst); log(p.name+' 弃置了1张手牌'); } render(); }),
    purgeAttrAll: (attr) => { let n=0; S.players.forEach(p=>p.slots.forEach(s=>{ if(s.inst&&cardOf(s.inst).attr===attr){ S.discard.push(s.inst); s.inst=null; n++; } })); log('清除全场'+attr+'属性友情区牌 '+n+' 张'); render(); },
    // 控制/标记
    skip: (pid,n) => { const p=P(pid); p.skip += n; log('⏭ '+p.name+' 出局 '+n+' 回合'); },
    restrict: (pid,key,n) => { const p=P(pid); p.flags.restrict[key]=(p.flags.restrict[key]||0)+n; log('🚫 '+p.name+' 获得 '+key+' 限制'); },
    protect: (pid,key,n) => { const p=P(pid); p.flags.protect[key]=(p.flags.protect[key]||0)+n; log('🛡 '+p.name+' 获得保护：'+key); },
    mark: (pid,key,n) => { const p=P(pid); p.flags.mark[key]=(p.flags.mark[key]||0)+n; log('🏷 '+p.name+' 获得标记：'+key); },
    global: (key,pid) => { S.gflags[key] = { pid, rounds: 1 }; log('🌐 全局效果：'+key); },
    poison: (pid,per,turns) => { P(pid).poison = { per, turns }; log('☠ '+P(pid).name+' 中毒（每回合弃'+per+'张，'+turns+'回合）'); },
    pending: (pid,n) => { P(pid).pendDiscard = (P(pid).pendDiscard||0)+n; log('⏳ '+P(pid).name+' 下回合结束需弃 '+P(pid).pendDiscard+' 张'); },
    extra: (pid,n) => { const p=P(pid); p.extraPlayNext=(p.extraPlayNext||0)+n; log('➕ '+p.name+' 下回合可额外出 '+n+' 张牌'); },
    // 小游戏
    singCheck: (pid,n) => { log('🎤 '+P(pid).name+' 被要求唱歌（数字版：跳过表演）'); if(P(pid).ai) discardFrom(pid,0); },
    guessTopResolve: (c,n,okFn) => {
      let top = S.deck[S.deck.length-1];
      if (!top) { A.note('牌堆为空'); return; }
      let tc = cardOf(top);
      while (tc.type!=='角色牌') { S.discard.push(S.deck.pop()); if(!S.deck.length){A.note('牌堆为空');return;} top = S.deck[S.deck.length-1]; tc = cardOf(top); }
      const ok = c.ar && c.ar.a===tc.attr && c.ar.r===tc.race;
      toast((ok?'猜对了！':'猜错了')+'（实际：'+tc.attr+tc.race+'）', ok?'gold':'err');
      S.discard.push(S.deck.pop());
      if (ok) okFn(c.actor);
    },
    guessHandResolve: c => {
      const t=P(c.t); if(!t||!c.guess) return;
      if(!c.guess.inst || !t.hand.includes(c.guess.inst)){ A.note('对方手牌已空，无法猜牌'); return; }
      const tc=cardOf(c.guess.inst);
      const hits=(c.guess.a===tc.attr?1:0)+(c.guess.r===tc.race?1:0);
      toast('猜测结果：'+hits+'个正确（实际 '+tc.attr+tc.race+'）', hits===2?'gold':'');
      if (hits===2) { rmHand(t,c.guess.inst); P(c.actor).hand.push(c.guess.inst); discardFrom(c.t,1); log('🎉 猜对2个：偷取成功+对方弃1张'); }
      else if (hits===1) { rmHand(t,c.guess.inst); S.discard.push(c.guess.inst); log('猜对1个：那张手牌被弃置'); }
      else discardFrom(c.actor,1);
      render();
    },

// 客户端发来的实例 id 可能是快照重建的 "id#c"，映射回真实实例（同 cid 逐个消费）
function normInsts(p, arr) {
  const out = []; const pool = p.hand.slice();
  for (const x of (arr||[])) {
    if (pool.includes(x)) { out.push(x); pool.splice(pool.indexOf(x), 1); }
    else if (typeof x === 'string' && /#/.test(x)) {
      const n = Number(String(x).split('#')[0]);
      const k = pool.findIndex(h => cid(h) === n);
      if (k > -1) { out.push(pool[k]); pool.splice(k, 1); }
    }
  }
  return out;
}

function applyAct(from, a, v) {
  if (!S || S.winner) return;

  if (S.pendingDiscard && a !== 'discard') return; // 等弃牌时只接受 discard
  switch (a) {
    case 'draw': if (S.phase==='draw' && cur().id===from && !S.resolve) doDraw(from); break;
    case 'endTurn': if (S.phase==='action' && cur().id===from && !S.resolve) endTurn(from); break;
    case 'play': {
      if (S.phase!=='action' || cur().id!==from || S.resolve) break;
      const inst = normInsts(p, [v.inst])[0];
      if (!inst) break;
      const card = cardOf(inst);
      if (card.type==='加帕里馒头') break;
      if (p.flags.mark.lockHand5 && p.hand.length >= 5) break;
      if (p.flags.restrict.noInstant && card.type==='角色牌') break;
      if (S.actionUsed && !p.extraPlay) break;
      if (p.extraPlay > 0) p.extraPlay--; else S.actionUsed = true;
      if (card.type==='事件牌') S.eventUsed = true;
      playCard(from, inst);
      break;
    }
case 'bun': {
const cutting = !!S.resolve;
if (!cutting && cur().id!==from) break;
if (cutting && (S.resolve.claimed || S.resolve.bunUsed >= 3)) break;
const inst = normInsts(p, [v.inst])[0];
if (!inst) break;
if (!cutting && (S.phase!=='action' || S.actionUsed)) break;
if (!cutting && p.flags.mark.lockHand5 && p.hand.length >= 5) break;
if (!cutting) { if (p.extraPlay > 0) p.extraPlay--; else S.actionUsed = true; }
playBun(from, inst);
break;
    }
    case 'place': {
      if (S.phase!=='action' || cur().id!==from || S.resolve) break;
      const inst = normInsts(p, [v.inst])[0];
      if (!inst) break;
      if (!isSoloCard(cardOf(inst))) break;
      if (cardOf(inst).type==='角色牌') S.actionUsed = true;
      place(from, inst, v.slot, true);
      break;
    }
    case 'counter': {
      const r = S.resolve; if (!r || r.kind==='event' || r.kind==='bun' || r.claimed) break;
      if (r.chain.some(ch=>ch.kind==='bun')) { netSend({ t:'gto', to: from, d:{ k:'evt', e:'toast', text:'连锁已被馒头截断，无法再反击', g:'err' } }); break; }

      if (!inst) break;
      const card = cardOf(inst);
      if (!card.counter) break;
      const lastCnt = (r.chain.length && r.chain[r.chain.length-1].kind==='counter') ? r.chain[r.chain.length-1] : null;
      if (lastCnt && lastCnt.by === from) { netSend({ t:'gto', to: from, d:{ k:'evt', e:'toast', text:'不能反击自己的反击', g:'err' } }); break; }
      if (!lastCnt && r.initiator === from) break;
      const tcardC = cardOf(lastCnt ? lastCnt.card : r.card);
      if (!counterFits(card, tcardC, !!lastCnt)) { netSend({ t:'gto', to: from, d:{ k:'evt', e:'toast', text:'属性不符：「'+card.name+'」无法反制「'+tcardC.name+'」的效果', g:'err' } }); log('🛡 '+p.name+' 想用「'+card.name+'」反击，但属性不符（'+card.counter+'），已拒绝'); break; }
      if (p.counters >= 2) break;
      rmHand(p, inst); p.counters++;
      r.chain.push({card:inst, by:from, kind:'counter'});
      if (isDolphin(card)) { p.extraPlay = (p.extraPlay||0)+1; netSend({ t:'gto', to: from, d:{ k:'evt', e:'toast', text:'🐬 海豚联盟被动：结算后可再打出一张牌触发其即时效果', g:'gold' } }); }

      toast(p.name+' 发动反击「'+card.name+'」！', 'err');
      log('🛡 '+p.name+' 反击「'+card.name+'」'+(lastCnt?'（连锁反击「'+tcardC.name+'」）':''), true);
      showCounterFX(card, p.name, tcardC);
      runCounterText(from, inst, lastCnt ? lastCnt.by : r.initiator, tcardC);
      aiReactToCounter();
      if (S.resolve && !S.resolve.claimed) startResolveCountdown(60);
      render(); publishState();
      break;
    }
    case 'claim': {
      const r = S.resolve; if (!r || r.claimed) break;

  }
}
document.getElementById('nick').addEventListener('change', e => { if (!e.target.readOnly) localStorage.setItem('kp_nick', e.target.value); });
document.getElementById('createBtn').onclick = () => {
  connTip(''); const nick = getNick();
  netConnect(() => {
    HOST = true;
    netSend({ t:'create', name: nick, uid: myUid(), av: KC6.avatar || '' });
  }, msg => connTip(msg));
};
document.getElementById('joinBtn').onclick = () => {
connTip('');
document.getElementById('joinRow').style.display = 'flex';
document.getElementById('joinCode').focus();
};
document.getElementById('joinCancel').onclick = () => {
document.getElementById('joinRow').style.display = 'none';
connTip('');
};
function doJoinRoom() {
connTip('');
const code = document.getElementById('joinCode').value.trim().toUpperCase();
if (code.length !== 4) { connTip('请输入4位房间码'); return; }
const nick = getNick();
netConnect(() => {
const tok = localStorage.getItem('kp_tok_'+code) || '';
netSend({ t:'join', room: code, name: nick, token: tok, uid: myUid(), av: KC6.avatar || '' });
}, msg => connTip(msg));
}
document.getElementById('joinGo').onclick = doJoinRoom;
document.getElementById('joinCode').addEventListener('keydown', e => { if (e.key === 'Enter') doJoinRoom(); });
document.getElementById('leaveBtn').onclick = () => {
  if (NET.started) return; // 对局中退出走游戏内菜单
  NET.quiet = true;
  try { NET.ws && NET.ws.close(); } catch(_) {}
  NET.on = false; NET.ws = null; NET.room = null; NET.pid = null; NET.members = []; HOST = false;
document.getElementById('waitRoom').classList.remove('show');
document.getElementById('menu').style.display = 'flex';
document.getElementById('joinRow').style.display = 'none';
connTip('已退出房间');
};
// 聊天发送（等待大厅 + 对局内）
document.getElementById('chatSend').onclick = () => sendChat(document.getElementById('chatIn'));
document.getElementById('chatSend2').onclick = () => sendChat(document.getElementById('chatIn2'));
['chatIn','chatIn2'].forEach(id => { const el = document.getElementById(id); if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(el); }); });
document.getElementById('startBtn').onclick = () => {
if (!HOST || NET.started) return;
netSend({ t:'start' });
startGameMp(NET.members);
};
document.getElementById('btnMenu').onclick = () => {
  if (S && S.tut) { if (confirm('退出教学实战？')) { S = null; clearTimers(); backMenu(); } return; }
  if (confirm('确定离开？离开后当前对局将丢失（房主离开会导致对局终止）')) { NET.quiet = true; location.reload(); }
};

// ============ 教学关（单机练习，联机版内嵌） ============
const TUT = { active: false, chapter: 1, queue: [], pending: 0 };
function tutFind(nameRe, type) {
  return CARDS.find(c => (!type || c.type === type) && (!nameRe || nameRe.test(c.name)));
}
function tutImg(c) { return c ? '<img src="' + c.img + '" onclick="showDetail(CM[' + c.id + '])">' : ''; }
function tutRow(cards) { return '<div class="tut-card-show">' + cards.map(tutImg).join('') + '</div>'; }
function tutDeal() {
  // 教学实战：给玩家固定的一手演示牌（羁绊对 + 角色 + 事件 + 馒头）
  const roles = CARDS.filter(c => c.type === '角色牌');
  const hero = roles.find(c => /薮猫/.test(c.name)) || roles[0];
  let mate = roles.find(c => c.id !== hero.id && (c.bonds || []).some(b => (hero.bonds || []).includes(b)));
  if (!mate) mate = roles.find(c => c.id !== hero.id) || roles[0];
  const evt = CARDS.find(c => c.type === '事件牌');
  const bun = CARDS.find(c => c.type === '加帕里馒头');
  const extra = roles.find(c => c.id !== hero.id && c.id !== mate.id) || roles[0];
  const hand = [hero.id + '#900', mate.id + '#901'];
  if (extra) hand.push(extra.id + '#902');
  if (evt) hand.push(evt.id + '#903');
  if (bun) hand.push(bun.id + '#904');
  P(myId).hand = hand;
  toast('📖 教学对局开始：这手牌是为教学准备的，试试打出角色牌凑羁绊！', 'gold');
  log('📖 教学对局：手牌已固定为教学演示牌');
}
function tutStart(chapter) {
TUT.active = true; TUT.chapter = chapter;
const tu = document.getElementById('tut');
const st = document.getElementById('tutStage');
document.getElementById('tutAva').src = IMG.mirai || '';
if (st && IMG.tutbg) { st.style.backgroundImage = 'url("' + IMG.tutbg + '")'; }
document.getElementById('tutName').textContent = '导游未来';
document.getElementById('menu').style.display = 'none';
document.getElementById('game').style.display = 'none';
document.getElementById('waitRoom').classList.remove('show');
tu.classList.add('show');
  TUT.queue = tutScript(chapter);
  tutNext();
}
function tutNext() {
  const st = TUT.queue.shift();
  if (!st) { tutEnd(); return; }
  document.getElementById('tutChTag').textContent = '第' + TUT.chapter + '章';
  document.getElementById('tutScroll').innerHTML = st.html;
  document.getElementById('tutScroll').scrollTop = 0;
  const nb = document.getElementById('tutNextBtn');
  nb.textContent = st.btn || '继续 ▶';
  nb.onclick = () => { if (st.act) { st.act(() => tutNext()); } else tutNext(); };
}
function tutEnd() {
TUT.active = false;
document.getElementById('tut').classList.remove('show');
if (!S) { document.getElementById('menu').style.display = 'flex'; }
}
function tutPractice(done) {
  TUT.pending = (TUT.chapter < 4) ? TUT.chapter + 1 : 0;
  tutEnd();
  // 教学实战：本地假联机（房主 + 一个离线 AI 搭档），不连服务器
  HOST = true; NET.pid = 'me'; myId = 'me';
  startGameMp([{pid:'me', name:getNick(), av:KC6.avatar||''}, {pid:'tutai', name:'教学搭档', offline:true}], {tut:true});
  done && done();
}
function tutScript(ch) {
  const roles = CARDS.filter(c => c.type === '角色牌');
  const hero = roles.find(c => /薮猫/.test(c.name)) || roles[0];
  let mate = roles.find(c => c.id !== hero.id && (c.bonds || []).some(b => (hero.bonds || []).includes(b))) || roles.find(c => c.id !== hero.id);
  const cnt = CARDS.find(c => c.counter) || hero;
  const evt = CARDS.find(c => c.type === '事件牌');
  const bun = CARDS.find(c => c.type === '加帕里馒头');
  if (ch === 1) return [
    { html: '欢迎来到<b>加帕里公园</b>！我是导游<b>未来</b>🐾<br>在开始之前，让我介绍一下这个公园里的<b>朋友卡牌</b>吧！' },
    { html: '【角色牌】是交朋友的核心！<br>每张角色牌有：<br>· <b>属性</b>（林原/沙漠/雪域/海洋）<br>· <b>种族</b>（兽类/鸟类/水生类）<br>· <b>友情值</b>（放进友情区的分数）<br>· <b>羁绊</b>（凑齐可额外赚友情值）<br>· <b>即时效果 / 反击效果</b><br>点牌可查看详情！' + tutRow([hero, mate]) },
    { html: '【事件牌】打出后立刻扭转局势！<br>事件牌效果强力，但<b>每人每回合只能打出一张事件牌</b>，而且打出后进入弃牌区。<br>没有写「对方」的效果默认作用于自己！' + (evt ? tutRow([evt]) : '') },
    { html: '【加帕里馒头】是最特别的牌：<br>· 馒头只能<b>直接放置</b>进友情区赚友情值<br>· 在连锁结算时打出馒头，可以<b>切断连锁</b>，让之后的任何卡都无法发动<br>· 馒头<b>无法被反击</b>！' + (bun ? tutRow([bun]) : '') },
    { html: '记住啦：牌的效果以<b>卡面文字</b>为准！<br>接下来去第二章学习游戏流程吧～', btn: '进入第二章 ▶', act: () => tutStart(2) }
  ];
  if (ch === 2) return [
    { html: '游戏流程很简单：<br><b>① 抽牌</b> → 每回合开始抽1张<br><b>② 行动</b> → 打出角色/事件牌发动效果，或把馒头、可单独放置的牌放进友情区<br><b>③ 结束回合</b> → 手牌上限7张，超了要弃牌' },
    { html: '友情区共有 <b>7 个格子</b>：<br>· 凑羁绊赚友情值<br>· 当<b>可用格不足3个</b>时，就会出局！<br>胜负判定：友情值达标并<b>宣告「交够了朋友」</b>，维持一整轮即获胜！' },
    { html: '纸上得来终觉浅——来一场<b>1v1 实战演练</b>吧！<br>我已经为你准备好了一手教学牌。', btn: '开始实战演练 ▶', act: (done) => tutPractice(done) }
  ];
  if (ch === 3) return [
    { html: '这一章讲最刺激的<b>连锁与反击</b>！<br>当有玩家打出角色牌时，其他玩家手里带「反击效果」的牌可以发动<b>反击</b>，让那个效果<b>无效</b>！' + tutRow([cnt]) },
    { html: '反击的规则：<br>· 反击牌只能反制<b>它文字里声明的情况</b>（如「沙漠属性角色效果发动时」就只能反沙漠牌）<br>· 反击也可以被反击，形成<b>连锁</b>！<br>· 每回合每人最多反击 <b>2 次</b><br>· 反击牌自己的收益效果在结算时生效' },
    { html: '被连锁缠住了怎么办？<br>打出<b>馒头</b>！馒头会<b>截断连锁</b>、立即结算，之后的任何卡都无法发动，而且馒头不能被反击！<br><b>事件牌</b>则无法被反击，但可以用馒头在结算前截断。' },
    { html: '连锁的结算顺序是<b>后发先至</b>——最后打出的反击最先结算。<br>想亲手试试的话，去实战里感受一下吧！', btn: '去实战试试 ▶', act: (done) => tutPractice(done) }
  ];
  if (ch === 4) return [
    { html: '最后一章：<b>友谊的获取</b>！<br>打出角色牌后，可以点「凑成羁绊」，从手牌里选出和它<b>共同羁绊</b>的绿框卡牌，一起放进友情区！' + tutRow([hero, mate]) },
    { html: '凑羁绊的要点：<br>· 每次最多选 <b>1~4 张</b>手牌<br>· 所有牌要有<b>至少一个共同羁绊</b><br>· 牌上会显示绿框提示可凑<br>· 凑成的羁绊会带来额外友情值加成！' },
    { html: '友情值≥门槛时点「宣告胜利」，维持一整轮不被打破就赢了；友情值跌回门槛下宣告会失效。<br>去实战里交朋友吧！', btn: '开始实战 ▶', act: (done) => tutPractice(done) }
  ];
  return [];
}
document.getElementById('tutSkipBtn').onclick = tutEnd;
document.getElementById('tutBtn').onclick = () => {
  if (NET.on) { toast('请先退出房间，再进入教学关', 'err'); return; }
  tutStart(1);
};

// ============ 大厅：准备就绪 ============
document.getElementById('readyBtn').onclick = () => {
  if (!NET.on || NET.started) return;
  if (NET.pid === NET.hostPid) return; // 房主无需准备
  NET.ready = !NET.ready;
  netSend({ t:'ready', v: NET.ready });
};

// ============ 败北按钮 ============
document.getElementById('btnRestart').onclick = () => {
  const ov = document.getElementById('loseOverlay');
  ov.classList.remove('fade', 'show');
  document.getElementById('winOverlay').classList.remove('show');
  if (S && S.tut) {
    // 教学实战重开：保持教学模式
    HOST = true; NET.pid = 'me'; myId = 'me';
    startGameMp([{pid:'me', name:getNick(), av:KC6.avatar||''}, {pid:'tutai', name:'教学搭档', offline:true}], {tut:true});
    return;
  }
  if (NET.on && NET.started) {
    if (HOST) {
      netSend({ t:'g', d:{ k:'evt', e:'newgame' } });
      NET.ready = false;
      startGameMp(NET.members);
    } else { toast('只有房主可以重开一局', 'err'); }
    return;
  }
  location.reload();
};
document.getElementById('btnQuitRoom').onclick = () => { NET.quiet = true; location.reload(); };
</script>
